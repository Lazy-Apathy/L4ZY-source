// hwrt 1 is greyed out (menu, settings search, assistant) when the GPU cannot trace;
// hwrtraison gives the reason, "" when ray tracing can run
settinglock hwrt 1 [hwrtraison]
// DLAA/DLSS (NVIDIA only) and FSR (any GPU with GL/Vulkan sharing) are greyed
// the same way; hwrtdlssraison / hwrtfsrraison give the reason, "" when allowed
looplist m [1 2 3 4] [ settinglock hwrtngxmode $m [hwrtdlssraison] ]
looplist m [5 6 7 8] [ settinglock hwrtngxmode $m [hwrtfsrraison] ]
AA_modename = [at [Native DLAA "DLSS Quality" "DLSS Balanced" "DLSS Performance" "FSR Native" "FSR Quality" "FSR Balanced" "FSR Performance"] $arg1]

newgui gfx [
    guititle "Graphics"
    MENU_width
    guilist [
        MENU_tab gfxtab 0 "General"
        guistrut 2
        MENU_tab gfxtab 1 "Ray tracing"
        guistrut 2
        MENU_tab gfxtab 5 "Performance"
        guistrut 2
        MENU_tab gfxtab 3 "HDR screen"
        guistrut 2
        MENU_tab gfxtab 4 "Classic"
    ]
    guibar
    if (= $gfxtab 0) [
        guisection "Lighting"
        guilist [
            guistayopen [
                guiradio "Classic (no RT)" hwrt 0
                guibar
                guiradio "Ray tracing" hwrt 1 [ if (!= $hwrtdebug 7) [ hwrtdebug 7 ] ]
            ]
        ]
        if (!=s (hwrtraison) "") [
            guitext (concatword "^f2" (hwrtraison))
        ]
        if $hwrt [
            if (hwrtlighteffective) [
                guitext "^f0Ray-traced lighting is running. Its settings: Ray tracing tab."
            ] [
                guitext "^f3Ray tracing chosen, but not running yet (no map, or it failed: see console)."
            ]
        ]

        guisection "Anti-Aliasing"
        guilist [
            guilist [ guicheckbox "FXAA in Native (softer)" lookfxaa ; guistrut $MENU_col 1 ]
            guitext "MSAA (Classic only) "
            guistayopen [
                guiradio "Off" fsaa (? (> $fsaa 0) -1 $fsaa)
                guibar
                guiradio "2x" fsaa 2
                guibar
                guiradio "4x" fsaa 4
                guibar
                guiradio "8x" fsaa 8
            ]
        ]
        if (>= (getvarmax hwrtngxmode) 4) [
            guilist [
                guistayopen [
                    guiradio "Native" hwrtngxmode 0 [ LOOK_retire; LOOK_apply ]
                    guibar
                    guiradio "DLAA" hwrtngxmode 1 [ LOOK_retire; LOOK_apply ]
                    guibar
                    guiradio "DLSS Quality" hwrtngxmode 2 [ LOOK_retire; LOOK_apply ]
                    guibar
                    guiradio "DLSS Balanced" hwrtngxmode 3 [ LOOK_retire; LOOK_apply ]
                    guibar
                    guiradio "DLSS Performance" hwrtngxmode 4 [ LOOK_retire; LOOK_apply ]
                ]
            ]
            if (= (getvarmax hwrtngxmode) 8) [
                guilist [
                    guistayopen [
                        guiradio "FSR Native" hwrtngxmode 5 [ LOOK_retire; LOOK_apply ]
                        guibar
                        guiradio "FSR Quality" hwrtngxmode 6 [ LOOK_retire; LOOK_apply ]
                        guibar
                        guiradio "FSR Balanced" hwrtngxmode 7 [ LOOK_retire; LOOK_apply ]
                        guibar
                        guiradio "FSR Performance" hwrtngxmode 8 [ LOOK_retire; LOOK_apply ]
                    ]
                ]
                if (!=s (hwrtdlssraison) "") [ guitext (concatword "^f2" (hwrtdlssraison)) ]
                if (!=s (hwrtfsrraison) "") [ guitext (concatword "^f2" (hwrtfsrraison)) ]
                if (&& (>= $hwrtngxmode 6) (=s (hwrtfsrraison) "")) [
                    guitext "FSR sharpening" 0
                    guislider hwrtfsrsharpness
                ]
            ]
            if (|| (&& (>= $hwrtngxmode 1) (<= $hwrtngxmode 4) (=s (hwrtdlssraison) "")) (|| (&& (>= $hwrtngxmode 2) (<= $hwrtngxmode 4)) (>= $hwrtngxmode 6))) [
                guilist [
                    if (&& (>= $hwrtngxmode 1) (<= $hwrtngxmode 4) (=s (hwrtdlssraison) "")) [
                        guitext "DLAA/DLSS sharpening "
                        guistayopen [
                            guiradio "Off" hwrtdlsssharpness 0
                            guibar
                            guiradio "10" hwrtdlsssharpness 10
                            guibar
                            guiradio "20" hwrtdlsssharpness 20
                            guibar
                            guiradio "40" hwrtdlsssharpness 40
                        ]
                        guistrut 3
                    ]
                    if (|| (&& (>= $hwrtngxmode 2) (<= $hwrtngxmode 4)) (>= $hwrtngxmode 6)) [ guicheckbox "Sharper textures (may shimmer)" hwrtupscalemipbias ]
                ]
            ]
            if (= (hwrtngxfallback) 1) [
                guitext (concatword "^f3Using Native: " (AA_modename $hwrtngxmode) " did not start. Your choice is kept.")
                if (!=s (hwrtngxreason) "") [ guitext (concatword "^f4" (hwrtngxreason)) ]
            ]
        ]

        guisection "Players"
        guilist [
            guicheckbox "Fullbright player models" fullbrightmodels 60 0
            if $fullbrightmodels [
                guibar
                guiradio "Subtle" fullbrightmodels 60
                guibar
                guiradio "Bright" fullbrightmodels 100
                guibar
                guiradio "Overbright" fullbrightmodels 150
                guibar
                guiradio "Max" fullbrightmodels 200
            ]
        ]
        guicheckbox "Everyone uses my player model" forceplayermodels
        guicheckbox "Always use team skins (blue / red)" teamskins

        guisection "Deaths"
        guilist [
            guilist [ guicheckbox "Blood" blood ; guistrut $MENU_col 1 ]
            guicheckbox "Hide dead players" hidedead
        ]
        guilist [
            guilist [ guicheckbox "Ragdoll deaths" ragdoll ; guistrut $MENU_col 1 ]
            if $ragdoll [
                guicheckbox "Keep after respawn" ragdollmillis 10000
            ]
        ]
        guitext "Ragdoll push (velocity multiplier)"
        guislider deadpush
    ]
    if (= $gfxtab 1) [
        if (! $hwrt) [
            guitext "^f2Ray tracing is off: choose it in General > Lighting." 0
        ] [
            guisection "Lights"
            guicheckbox "Teleporters glow and light the room" hwrtteleportlight
            guicheckbox "Jump pads glow and light the room" hwrtjumppadlight
            guicheckbox "Weapons light the scene (flashes, rockets, explosions)" hwrtdynlights

            guisection "Shadows"
            guitext "My own shadow (first person)" 0
            guistayopen [
                guilist [
                    guiradio "None" hwrtshadowself 0
                    guibar
                    guiradio "Sun (default)" hwrtshadowself 1
                    guibar
                    guiradio "+ glows" hwrtshadowself 2
                    guibar
                    guiradio "+ nearby lamps" hwrtshadowself 3
                    guibar
                    guiradio "+ sky" hwrtshadowself 4
                ]
            ]
            guitext "Shadows of the others" 0
            guistayopen [
                guilist [
                    guiradio "None" hwrtshadowothers 0
                    guibar
                    guiradio "Sun and sky" hwrtshadowothers 1
                    guibar
                    guiradio "+ glows (default)" hwrtshadowothers 2
                    guibar
                    guiradio "+ map lamps" hwrtshadowothers 3
                ]
            ]
            guicheckbox "Weapon smoke casts shadows" hwrtsmokeshadow
            if $hwrtsmokeshadow [
                guitext "Smoke shadow density (percent)" 0
                guislider hwrtsmokeshadowdensity
            ]
            guilist [
                guilist [ guitext "Soft shadows" 0 ; guistrut $MENU_col 1 ]
                guistayopen [
                    guiradio "Off" hwrtsoftshadows 0
                    guibar
                    guiradio "On (default)" hwrtsoftshadows 2
                ]
            ]
            if (= $hwrtsoftshadows 1) [ guitext "^f2Sun only (set in the console): choose On or Off to change it." 0 ]
            if $hwrtsoftshadows [
                guilist [
                    guilist [ guitext "Soft shadow rays" 0 ; guistrut $MENU_col 1 ]
                    guistayopen [
                        guiradio "1" hwrtsoftshadowrays 1
                        guibar
                        guiradio "2 (default)" hwrtsoftshadowrays 2
                        guibar
                        guiradio "4" hwrtsoftshadowrays 4
                        guibar
                        guiradio "8" hwrtsoftshadowrays 8
                    ]
                ]
                guilist [
                    guilist [ guitext "Soft shadow denoiser" 0 ; guistrut $MENU_col 1 ]
                    guistayopen [
                        guiradio "Off" hwrtsoftsigma 0
                        guibar
                        guiradio "On (NRD SIGMA, default)" hwrtsoftsigma 1
                    ]
                ]
                if $hwrtsoftsigma [
                    if (! $hwrtnrd) [ guitext "^f2Needs the NRD denoiser (Performance > Advanced)." 0 ]
                    guilist [
                        guilist [ guitext "Denoiser steadiness" 0 ; guistrut $MENU_col 1 ]
                        guistayopen [
                            guiradio "0" hwrtsoftsigmahistory 0
                            guibar
                            guiradio "3" hwrtsoftsigmahistory 3
                            guibar
                            guiradio "5 (default)" hwrtsoftsigmahistory 5
                            guibar
                            guiradio "7" hwrtsoftsigmahistory 7
                        ]
                    ]
                ]
            ]

            guisection "Surfaces"
            guicheckbox "Reflections on water and reflective surfaces" hwrtreflections
            guicheckbox "Animated waves on water (ripples in the RT reflections)" hwrtwaterwaves
            if $hwrtwaterwaves [
                if (! $hwrtreflections) [ guitext "^f2Needs the reflections above." 0 ]
                guilist [
                    guilist [ guitext "Wave strength" 0 ; guistrut 12 1 ]
                    guifield waterwaveamp 4
                    guistayopen [ guibutton " - " [waterwaveamp (+fround $waterwaveamp -0.25)] 0 ]
                    guistayopen [ guibutton " + " [waterwaveamp (+fround $waterwaveamp 0.25)] 0 ]
                    HUD_gap
                    guilist [ guitext "Speed" 0 ; guistrut 6 1 ]
                    guifield waterwavespeed 4
                    guistayopen [ guibutton " - " [waterwavespeed (+fround $waterwavespeed -0.25)] 0 ]
                    guistayopen [ guibutton " + " [waterwavespeed (+fround $waterwavespeed 0.25)] 0 ]
                ]
                guilist [
                    guilist [ guitext "Wave detail" 0 ; guistrut 12 1 ]
                    guistayopen [
                        guiradio "64" waterwavesize 64
                        guibar
                        guiradio "128 (default)" waterwavesize 128
                        guibar
                        guiradio "256" waterwavesize 256
                    ]
                ]
            ]
            guicheckbox "Shine of lamps and sun on glossy surfaces" hwrtspecular
            guicheckbox "Smooth lighting across faceted floors and walls" hwrtsmoothnormals
        ]
    ]
    if (= $gfxtab 5) [
        if (! $hwrt) [
            guitext "^f2Ray tracing is off: choose it in General > Lighting." 0
        ] [
            GFX_prof = (GFX_profwhich)
            guisection "Profile"
            guistayopen [
                guilist [
                    guiradio "Ultra" GFX_prof 0 [ GFX_profapply 0 ]
                    guibar
                    guiradio "High" GFX_prof 1 [ GFX_profapply 1 ]
                    guibar
                    guiradio "Medium" GFX_prof 2 [ GFX_profapply 2 ]
                    guibar
                    guiradio "Low" GFX_prof 3 [ GFX_profapply 3 ]
                    guibar
                    guiradio "Custom" GFX_prof 4 [ GFX_prof = 4 ]
                ]
            ]
        ]
        guilist [
            MENU_tab gfxperftab 0 "Main choices"
            guistrut 2
            MENU_tab gfxperftab 1 "Advanced: sky, lamps, textures"
        ]
        guibar
    ]
    if (&& (= $gfxtab 5) (= $gfxperftab 0)) [
        if $hwrt [
            guilist [
                guilist [ guitext "RT quality" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Full (best)" hwrtquality 2
                    guibar
                    guiradio "Half sky" hwrtquality 1
                    guibar
                    guiradio "Half sky, 1 glow" hwrtquality 0
                ]
            ]
            guilist [
                guilist [ guitext "DLSS model" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Transformer (sharper, slower)" hwrtdlsscnn 0
                    guibar
                    guiradio "CNN (faster, softer)" hwrtdlsscnn 1
                ]
            ]
            guilist [
                guilist [ guitext "Leaves" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "See-through (exact)" hwrtskyopaque 0
                    guibar
                    guiradio "Solid (faster under trees)" hwrtskyopaque 1
                ]
            ]
            guilist [
                guilist [ guitext "NRD denoiser" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Full" hwrtnrdlight 0
                    guibar
                    guiradio "Light (faster)" hwrtnrdlight 1
                    guibar
                    guiradio "Lightest (more flicker)" hwrtnrdlight 2
                ]
            ]
            guilist [
                guilist [ guitext "Still models" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Drawn again (exact)" hwrtvelstatic 0
                    guibar
                    guiradio "From depth (less CPU)" hwrtvelstatic 1
                ]
            ]
            guilist [
                guilist [ guitext "Sky reach" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Full" hwrtskyrange 0
                    guibar
                    guiradio "1024" hwrtskyrange 1024
                    guibar
                    guiradio "512" hwrtskyrange 512
                    guibar
                    guiradio "256" hwrtskyrange 256
                ]
            ]
            guilist [
                guilist [ guitext "Adaptive rays" 0 ; guistrut $GFX_perfcol 1 ]
                guistayopen [
                    guiradio "Off" hwrtrtadapt 0
                    guibar
                    guiradio "On (fewer rays at edges, far, in motion)" hwrtrtadapt 1
                ]
            ]
        ]
    ]
    if (&& (= $gfxtab 5) (= $gfxperftab 1)) [
        guisection "Sky light"
        if (= (getvarmax hwrtnrd) 1) [
            guitext "Sky light denoiser" 0
            guistayopen [
                guilist [
                    guiradio "Built-in filter" hwrtnrd 0
                    guibar
                    guiradio "NRD (stronger, with Native, DLSS and FSR)" hwrtnrd 1
                ]
            ]
            if (&& (= (hwrtnrdfallback) 1) (hwrtlighteffective)) [
                guitext "^f3NRD is unavailable here: the built-in filter is used."
            ]
        ]
        if $hwrt [
            guilist [
                guilist [ guitext "Rays per pixel (NRD)" 0 ; guistrut $MENU_col 1 ]
                guistayopen [
                    guiradio "1" hwrtskyrays 1
                    guibar
                    guiradio "2" hwrtskyrays 2
                    guibar
                    guiradio "3" hwrtskyrays 3
                    guibar
                    guiradio "4" hwrtskyrays 4
                ]
            ]
            guitext "Built-in filter: smoothing over frames (default: 32, 0 = off)" 0
            guislider hwrtskytemporal
            guicheckbox "Blur between neighbouring pixels (both denoisers)" hwrtskyfilter
            guicheckbox "Draw the sun as a disk (instead of the map's sky picture)" hwrtsundisk

            guisection "Lamps and textures"
            guilist [
                guilist [ guitext "Lamps with a shadow" 0 ; guistrut $MENU_col 1 ]
                guistayopen [
                    guiradio "1" hwrtdlights 1
                    guibar
                    guiradio "2" hwrtdlights 2
                    guibar
                    guiradio "3" hwrtdlights 3
                    guibar
                    guiradio "4" hwrtdlights 4
                ]
            ]
            guitext "Glowing lights traced (teleporters, lava; default: 8)" 0
            guislider hwrtglowdlights

            guilist [
                guilist [ guitext "Texture upscaling" 0 ; guistrut $MENU_col 1 ]
                guistayopen [
                    guiradio "Bicubic" hwrtdiffupscale 2
                    guibar
                    guiradio "Lanczos (sharper)" hwrtdiffupscale 3
                    guibar
                    guiradio "Nearest" hwrtdiffupscale 0
                ]
            ]
            guilist [
                guilist [ guitext "Texture detail far" 0 ; guistrut $MENU_col 1 ]
                guistayopen [
                    guiradio "Stable (less shimmer)" hwrtdiffmipbias 0
                    guibar
                    guiradio "Sharper" hwrtdiffmipbias -0.5
                ]
            ]
        ]
    ]
    if (= $gfxtab 3) [
        guisection "Display output"
        guilist [
            guistayopen [
                guiradio "SDR" hdroutpref 0
                guibar
                guiradio "Native HDR" hdroutpref 1
            ]
        ]
        if (= (hdrouteffectif) 2) [
            guitext "^f0In use: Native HDR"
        ] [
            if (= (hdrouteffectif) 1) [
                guitext "^f2In use: HDR preview shown in SDR (diagnostic, not native HDR)"
            ] [
                guitext "In use: SDR"
            ]
        ]
        if (&& (!= $hdroutpref 0) (= (hdroutdispo) 0)) [
            guitext (concat (? (= $hdroutpref 1) "^f3" "^f4") (hdroutraison))
        ]

        guisection "HDR calibration"
        guitext (format "Exposure: %1 EV (default 0)" $hwrthdrexp)
        guilist [
            guistayopen [
                guibutton "-0.5" [ hdroutexpstep -0.5 ]
                guibar
                guibutton "-0.1" [ hdroutexpstep -0.1 ]
                guibar
                guibutton "+0.1" [ hdroutexpstep 0.1 ]
                guibar
                guibutton "+0.5" [ hdroutexpstep 0.5 ]
                guibar
                guibutton "Reset" [ hwrthdrexp 0 ]
            ]
        ]
        guitext (format "Reference white: %1 nits (default 80)" $hdroutref)
        guislider hdroutref
        guitext (hdroutpeaklabel)
        guilist [
            guistayopen [
                guiradio "Automatic peak" hdroutmax 0
                guibar
                if (= $hdroutmax 0) [
                    guibutton "Manual peak" [ hdroutmax (max 400 (hdroutpeakauto)) ]
                ] [
                    guibutton "-100" [ hdroutmax (max 100 (- $hdroutmax 100)) ]
                    guibar
                    guibutton "+100" [ hdroutmax (min 10000 (+ $hdroutmax 100)) ]
                ]
            ]
        ]
        guitext (hdrouthudlabel)
        guilist [
            guistayopen [
                guiradio "HUD follows reference white" hdrouthud 0
                guibar
                if (= $hdrouthud 0) [
                    guibutton "Custom HUD brightness" [ hdrouthud (max 40 $hdroutref) ]
                ]
            ]
        ]
        if (> $hdrouthud 0) [ guislider hdrouthud ]
    ]
    if (= $gfxtab 4) [
        guisection "Shading (classic lighting)"
        guilist [
            guilist [ guitext "Ambient Occlusion" 0 ; guistrut $MENU_col 1 ]
            guistayopen [
                guiradio "Off" gtao 0
                guibar
                guiradio "Low" gtao 1
                guibar
                guiradio "High" gtao 2
            ]
        ]
        if (&& $gtao (hwrtlighteffective)) [ guitext "^f2Not used with ray tracing: RT already traces the sky light." ]
        if (= $gtao 0) [
            guilist [
                guilist [ guicheckbox "Old corner shading" lookao ; guistrut $MENU_col 1 ]
                if $lookao [
                    guitext "Strength" 0
                    guifield lookaoscale 4
                    guistayopen [ guibutton " - " [lookaoscale (+fround $lookaoscale -0.05)] 0 ]
                    guistayopen [ guibutton " + " [lookaoscale (+fround $lookaoscale 0.05)] 0 ]
                    HUD_gap
                    guitext "Size" 0
                    guifield lookaoradius 4
                    guistayopen [ guibutton " - " [lookaoradius (+fround $lookaoradius -0.05)] 0 ]
                    guistayopen [ guibutton " + " [lookaoradius (+fround $lookaoradius 0.05)] 0 ]
                ]
            ]
        ]

        guisection "Detail"
        guitext "Speed: ^f0Fast^f~, ^f2Moderate^f~, ^f3Slow and Pretty^f~" 0
        guilist [
            GFX_name "Shaders"
            guibar
            guiradio "^f0Low Detail" shaderdetail 1
            guibar
            guiradio "^f2High Detail" shaderdetail 3
        ]
        guilist [
            GFX_name "Water"
            guibar
            guicheckbox "^f2Refraction"  waterrefract
            guibar
            guicheckbox "^f3Reflection"  waterreflect
            guibar
            guicheckbox "^f0Caustics"    caustics
            guibar
            guicheckbox "^f2Animation"   vertwater
        ]
        guilist [
            GFX_name "Water waves"
            guibar
            guicheckbox "^f2Animated (ripples in reflections and refraction)" waterwaves
        ]
        if $waterwaves [
            guilist [
                guilist [ guitext "Wave strength" 0 ; guistrut 12 1 ]
                guifield waterwaveamp 4
                guistayopen [ guibutton " - " [waterwaveamp (+fround $waterwaveamp -0.25)] 0 ]
                guistayopen [ guibutton " + " [waterwaveamp (+fround $waterwaveamp 0.25)] 0 ]
                HUD_gap
                guilist [ guitext "Speed" 0 ; guistrut 6 1 ]
                guifield waterwavespeed 4
                guistayopen [ guibutton " - " [waterwavespeed (+fround $waterwavespeed -0.25)] 0 ]
                guistayopen [ guibutton " + " [waterwavespeed (+fround $waterwavespeed 0.25)] 0 ]
