newgui keys [
    guititle "KEYS"
    guistrut 0.1
    guitext "Basic binds. For more, use the bind command."
    guitext "Select an action, then press the keys (Esc when done):"

    bindidx = 0
    guilistsplit n 2 $bindactions [
        guilist [
            guitext (tabify (concatword (at $bindlabels $bindidx) ": ") 8)
            [newbinds@bindidx] = (searchbinds $n)
            guikeyfield [newbinds@bindidx] -12 [
                oldbinds = (searchbinds [@@n])
                looplist j $oldbinds [bind $j ""]
                looplist j $[newbinds@@bindidx] [bind $j [@@@n]]
            ]
            bindidx = (+ $bindidx 1)
        ]
    ] [guibar]
] 0

