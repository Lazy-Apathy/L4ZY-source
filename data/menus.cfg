showmapshot = [
    guibar
    mname = (checkrolloveraction "map " [if (> $numargs 0) [result $arg1] [at $guirollovername 0]])
    guilist [
        guiimage (concatword "packages/base/" $mname ".jpg") (checkrolloveraction "map ") 4 1 "data/cube.png" $mname
    ]
]

showmapcols = [
    mapcoln = (div (+ (listlen $arg1) 2) 3)
    if (< $mapcoln 1) [mapcoln = 1]
    if (at $guirollovername 0) [
        guibackdrop (concatword "packages/base/" (at $guirollovername 0) ".jpg")
    ]
    guilist [
        loop a 3 [
            guilist [
                guistrut 15 1
                loopsublist curmap $arg1 (* $a $mapcoln) $mapcoln [
                    guibutton $curmap (concat map $curmap) "cube"
                ]
            ]
        ]
    ]
]

