bindactions = [forward backward left right jump attack togglezoom saycommand sayteamcommand showscores toggleconsole togglechat togglekilllog tretry toggletranslate togglematchrecord toggledemorecord screenshot edittoggle "setweapon FI" "setweapon SG" "setweapon CG" "setweapon RL" "setweapon RI" "setweapon GL" "setweapon PI" "weapon" "universaldelta 1" "universaldelta -1" dropflag addbot delbot]
bindlabels = [Forward Backward Left Right Jump Attack "Toggle Zoom" Chat "Team Chat" Scoreboard Console "Expanded Chat" "Kills / Deaths" "Retry Translation" "Mute Translation" "Match Record" "Demo Record" Screenshot "Edit Mode" Chainsaw Shotgun Chaingun Rocket Rifle Grenade Pistol "Next Weapon" "Wheel Up" "Wheel Down" "Drop Flag" "Add Bot" "Delete Bot"]

entupdate = [ entset $entguitype $entguiattr0 $entguiattr1 $entguiattr2 $entguiattr3 $entguiattr4 ]

initentgui = [
  entguitype = (enttype)
  @(loopconcat i 5 [result [
    entguiattr@i = (entattr @i)
  ]])
]

genentattributes = [
    entattributes = (loopconcat i (listlen $arg2) [
        entattribname = (at $arg2 $i)
        entattriblimits = (at $arg3 (* 2 $i))
        entattriblimits2 = (at $arg3 (+ 1 (* 2 $i)))
        if (=s (at $entattriblimits 0) $entattriblimits) [
            result [
                guitext @entattribname
                guislider entguiattr@i @entattriblimits @entattriblimits2 entupdate
            ]
        ] [
            result [
                guitext @entattribname
                guinameslider entguiattr@i [@@entattriblimits] [@@entattriblimits2] entupdate
            ]
        ]
    ])
]

guilistsplit = [
  guilist [
    z = (div (+ (listlen $arg3) (- $arg2 1)) $arg2)
    loop a $arg2 [
      guilist [
        if (>= $numargs 6) [arg6]
        loopsublist $arg1 $arg3 (* $a $z) $z [
          arg4
        ]
      ]
      if (&& (>= $numargs 5) (< (+ $a 1) $arg2)) [arg5]
    ]
  ]
]

