        guilist [
            guistrut 3
            guilist [
                guicheckbox "Sway when I move" hudgunsway
            ]
        ]
    ]
    guisection "Muzzle flashes (every player)"
    guicheckbox "Flash" muzzleflash
    guicheckbox "Light (lights walls and players when shooting)" muzzlelight
    if $muzzlelight [
        guilist [
            guistrut 3
            guilist [
                guicheckbox "Shotgun" muzzlelightshotgun
                guicheckbox "Chaingun" muzzlelightchaingun
