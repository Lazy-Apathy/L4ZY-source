// hwrt 1 is greyed out (menu, settings search, assistant) when the GPU cannot trace;
// hwrtraison gives the reason, "" when ray tracing can run
settinglock hwrt 1 [hwrtraison]

newgui gfx [
    guititle "Graphics"
    guisection "Lighting"
    guitext "^f4Classic: original Sauerbraten lighting, no ray-tracing GPU needed. Ray tracing: RT lights, sun and sky."
    guilist [
        guistayopen [
            guiradio "Classic (no RT)" hwrt 0
            guibar
            guiradio "Ray tracing" hwrt 1 [ if (!= $hwrtdebug 7) [ hwrtdebug 7 ] ]
        ]
    ]
    if (!=s (hwrtraison) "") [
        guitext (concatword "^f2" (hwrtraison))
        guitext "^f4It needs a graphics card with hardware ray tracing and an up-to-date graphics driver."
    ]
    if $hwrt [
        if (hwrtlighteffective) [
            guitext "^f0Ray-traced lighting is running."
        ] [
            guitext "^f3Ray tracing chosen, but RT lighting is not running yet (no map loaded, or it failed: see console)."
        ]
    ]

    guisection "Display output"
    guitext "^f4Native HDR sends a real HDR picture to an HDR screen. Windows HDR must already be on (it is never changed here)."
    guilist [
        guistayopen [
            guiradio "Automatic" hdroutpref -1
            guibar
            guiradio "SDR" hdroutpref 0
            guibar
            guiradio "Native HDR" hdroutpref 1
        ]
    ]
    if (= $hdroutpref -1) [ guitext "^f4Automatic: Native HDR if Windows HDR is on and supported, otherwise SDR." ]
    if (= (hdrouteffectif) 2) [
        guitext "^f0In use: Native HDR"
    ] [
        if (= (hdrouteffectif) 1) [
            guitext "^f2In use: HDR preview shown in SDR (diagnostic, not native HDR)"
        ] [
            guitext "In use: SDR"
        ]
    ]
    if (&& (!= $hdroutpref 0) (= (hdroutdispo) 0)) [
        guitext (concat (? (= $hdroutpref 1) "^f3" "^f4") (hdroutraison))
    ]

    guisection "HDR calibration"
    guitext "^f4Used by Native HDR only. Kept across maps, outputs, anti-aliasing and lighting."
    guitext (format "Exposure: %1 EV (default 0)" $hwrthdrexp)
    guilist [
        guistayopen [
            guibutton "-0.5" [ hdroutexpstep -0.5 ]
            guibar
            guibutton "-0.1" [ hdroutexpstep -0.1 ]
            guibar
            guibutton "+0.1" [ hdroutexpstep 0.1 ]
            guibar
            guibutton "+0.5" [ hdroutexpstep 0.5 ]
            guibar
            guibutton "Reset" [ hwrthdrexp 0 ]
        ]
    ]
    guitext (format "Reference white: %1 nits (default 80)" $hdroutref)
    guislider hdroutref
    guitext (hdroutpeaklabel)
    guilist [
        guistayopen [
            guiradio "Automatic peak" hdroutmax 0
            guibar
            if (= $hdroutmax 0) [
                guibutton "Manual peak" [ hdroutmax (max 400 (hdroutpeakauto)) ]
            ] [
                guibutton "-100" [ hdroutmax (max 100 (- $hdroutmax 100)) ]
                guibar
                guibutton "+100" [ hdroutmax (min 10000 (+ $hdroutmax 100)) ]
            ]
        ]
    ]
    guitext (hdrouthudlabel)
    guilist [
        guistayopen [
            guiradio "HUD follows reference white" hdrouthud 0
            guibar
            if (= $hdrouthud 0) [
                guibutton "Custom HUD brightness" [ hdrouthud (max 40 $hdroutref) ]
            ]
        ]
    ]
    if (> $hdrouthud 0) [ guislider hdrouthud ]

    guisection "Look"
    guilist [
        guicheckbox "Creases (SSAO)" lookao
        guibar
        guicheckbox "Temporal AA" looktaa
        guibar
        guicheckbox "My Shadow (Sun)" lookselfshadow
    ]
    if (&& (= (getvarmax hwrtngxmode) 4) (!= (hwrtngxmodeapplied) 0)) [
        guitext "^f4Temporal AA / FXAA unused while DLAA or DLSS is on. They return on Native."
    ]
    if (= (hdrouteffectif) 2) [
        guitext "^f4Creases (SSAO) and Temporal AA are not applied in Native HDR."
    ]
    guilist [
        guicheckbox "Teleport light" hwrtteleportlight
        guibar
        guicheckbox "Jumppad light" hwrtjumppadlight
    ]
    guitext "^f4Uncheck creases / my shadow if they look dirty or ugly indoors."

    if (= (getvarmax hwrtngxmode) 4) [
        guisection "Anti-Aliasing"
        guitext "^f4Native, or NVIDIA DLAA / DLSS. Quality uses more internal pixels than Performance."
        guilist [
            guistayopen [
                guiradio "Native" hwrtngxmode 0 [ LOOK_retire; LOOK_apply ]
                guibar
                guiradio "DLAA" hwrtngxmode 1 [ LOOK_retire; LOOK_apply ]
                guibar
                guiradio "DLSS Quality" hwrtngxmode 2 [ LOOK_retire; LOOK_apply ]
                guibar
                guiradio "DLSS Balanced" hwrtngxmode 3 [ LOOK_retire; LOOK_apply ]
                guibar
                guiradio "DLSS Performance" hwrtngxmode 4 [ LOOK_retire; LOOK_apply ]
            ]
        ]
        if (= (hwrtngxfallback) 1) [
            guitext "^f3Using Native — DLAA/DLSS did not start."
        ]
    ]

    if (= (getvarmax hwrtnrd) 1) [
        guisection "RT Sky Denoise"
        guitext "^f4Ray tracing only. Filters the ray-traced sky light. NRD works with Native and DLSS."
        guilist [
            guistayopen [
                guiradio "Sauer filter" hwrtnrd 0
                guibar
                guiradio "NRD" hwrtnrd 1
            ]
        ]
        if (= (hwrtnrdfallback) 1) [
            guitext "^f3Using the Sauer filter — NRD unavailable."
        ]
    ]

    guisection "Deaths"
    guicheckbox "Blood" blood
    guilist [
        guicheckbox "Ragdoll Deaths" ragdoll
        if $ragdoll [
            guibar
            guicheckbox "Keep After Respawn" ragdollmillis 10000
        ]
        guibar
        guicheckbox "Hide Dead Players" hidedead
    ]
    guitext "Ragdoll Velocity Multiplier"
    guislider deadpush

    guisection "Players"
    guilist [
        guicheckbox "Fullbright Player Models" fullbrightmodels 60 0
        if $fullbrightmodels [
            guibar
            guiradio "Subtle" fullbrightmodels 60
            guibar
            guiradio "Bright" fullbrightmodels 100
            guibar
            guiradio "Overbright" fullbrightmodels 150
            guibar
            guiradio "Max" fullbrightmodels 200
        ]
    ]
    guilist [
        guicheckbox "Force Matching Player Models" forceplayermodels
        guibar
        guicheckbox "Always Use Team Skins" teamskins
    ]

    guisection "Advanced"
    guitext "Performance Key: ^f0Fast^f~, ^f2Moderate^f~, ^f3Slow and Pretty^f~"
    guibar
    guilist [
        GFX_name "Shaders"
        guibar
        guiradio "^f0Low Detail" shaderdetail 1
        guibar
        guiradio "^f2High Detail" shaderdetail 3
    ]
    guilist [
        GFX_name "Water"
        guibar
        guicheckbox "^f2Refraction"  waterrefract
        guibar
        guicheckbox "^f3Reflection"  waterreflect
        guibar
        guicheckbox "^f0Caustics"    caustics
        guibar
        guicheckbox "^f2Animation"   vertwater
    ]
    guilist [
        GFX_name "Waterfalls"
        guibar
        guicheckbox "^f2Refraction" waterfallrefract
        guibar
        guicheckbox "^f0Reflection" waterfallenv
    ]
    guilist [
        GFX_name "^f3Soft Shadows"
        guibar
        guicheckbox "On" shadowmap
        if $shadowmap [
            guibar
            guiradio "^f2Medium Quality" shadowmapsize 9 [blurshadowmap 1]
            guibar
            guiradio "^f3High Quality"   shadowmapsize 10 [blurshadowmap 2]
        ] [
            guibar
            guicheckbox "^f2Blob Shadows" blobs
        ]
    ]
    if $glare [
        glarepreset = 0
        if (= $glarescale 1) [
            if (= $blurglare 4) [glarepreset = 1]
            if (= $blurglare 7) [glarepreset = 3]
        ]
        if (= $glarescale 2) [
            if (= $blurglare 3) [glarepreset = 2]
            if (= $blurglare 7) [glarepreset = 4]
        ]
    ]
    guilist [
        GFX_name "^f3Glare"
        guibar
        guicheckbox "On" glare
        if $glare [
            guibar
            guiradio "^f2Subtle" glarepreset 1 [blurglare 4; glarescale 1]
            guibar
            guiradio "^f2Glowy" glarepreset 2 [blurglare 3; glarescale 2]
            guibar
            guiradio "^f3Soft" glarepreset 3 [blurglare 7; glarescale 1]
            guibar
            guiradio "^f3Intense" glarepreset 4 [blurglare 7; glarescale 2]
        ]
    ]
    guilist [
        GFX_name "^f3Motion Blur"
        guibar
        guicheckbox "On" motionblur
        if $motionblur [
            guibar
            guiradio "^f3Subtle" motionblurscale 0.5
            guibar
            guiradio "^f3Moderate" motionblurscale 0.65
            guibar
            guiradio "^f3Intense" motionblurscale 0.8
        ]
    ]
    guilist [
        GFX_name "^f3Grass"
        guibar
        guicheckbox "On" grass
        if $grass [
            guibar
            guiradio "^f2Quick Fade" grassdist 128
            guibar
            guiradio "^f2Moderate Fade" grassdist 256
            guibar
            guiradio "^f3Slow Fade" grassdist 512
        ]
    ]
    guilist [
        GFX_name "^f0Dynamic Lights"
        guibar
        guicheckbox "On" maxdynlights 3 0
        if $maxdynlights [
            guibar
            guiradio "^f0Medium Quality" maxdynlights 3
            guibar
            guiradio "^f2High Quality" maxdynlights 5
        ]
    ]
    guilist [
        GFX_name "^f0Soft Particles"
        guibar
        guicheckbox "On" depthfx
        if $depthfx [
            guibar
            guiradio "^f0Low Quality" depthfxsize 7 [blurdepthfx 1]
            guibar
            guiradio "^f2Medium Quality" depthfxsize 10 [blurdepthfx 0]
            guibar
            guiradio "^f3High Quality" depthfxsize 12 [blurdepthfx 0]
        ]
    ]
    guilist [
        GFX_name "^f0Glass Reflection"
        guibar
        guicheckbox "On" glassenv
    ]
    guilist [
        GFX_name "^f0Decals"
        guibar
        guicheckbox "On" decals
        if $decals [
            guibar
            guiradio "^f0Quick Fade" decalfade 10000 [maxdecaltris 1024]
            guibar
            guiradio "^f2Slow Fade" decalfade 60000 [maxdecaltris 4096]
        ]
    ]
    guilist [
        GFX_name "Textures"
        guibar
        guiradio "^f0Low Quality" maxtexsize 256
        guibar
        guiradio "^f0Medium Quality" maxtexsize 512
        guibar
        guiradio "^f2High Quality" maxtexsize 0
    ]
    guilist [
        GFX_name "Models"
        guibar
        guicheckbox "^f0Reflection"  envmapmodels
        guibar
        guicheckbox "^f2Bump Map" bumpmodels
    ]
] 0

