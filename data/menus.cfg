newgui crosshair [
    guititle "Crosshair"
    MENU_width
    guisection "Look"
    guitext "Size" 0
    guislider crosshairsize
    guistayopen [
        crosshaircolourpicks crosshaircolour "Crosshair colour (hex)"
    ]
    loop row (div (+ (listlen $crosshairs) 6) 7) [
        guilist [
            loop col 7 [
                ch = (at $crosshairs (+ (* $row 7) $col))
                if (!=s $ch "") [
                    guiimage (at $ch 0) [
                        cleargui 1
                        loadcrosshair @(at $ch 0) 0
                        loadcrosshair @(at $ch (if (> (listlen $ch) 1) 1 0)) 2
                    ] 0.5
                ]
            ]
        ]
    ]
