// Keys: every action that can be bound, by section. Each list is one section
// (actions / labels); a field shows the keys bound now and takes new ones.
// KEYS_list = normal keys, KEYS_speclist = while spectating, KEYS_editlist =
// in edit mode (the game keeps three key maps). The action string is the one
// the bind stores, so a key already bound to it is shown.
KEYS_list = [
    KEYS_l = $arg2
    KEYS_i = 0
    guilistsplit n 2 $arg1 [
        guilist [
            guilist [ guitext (at $KEYS_l $KEYS_i) 0 ; guistrut 18 1 ]
            [newbinds@bindidx] = (searchbinds $n)
            guikeyfield [newbinds@bindidx] -12 [
                oldbinds = (searchbinds [@@n])
                looplist j $oldbinds [bind $j ""]
                looplist j $[newbinds@@bindidx] [bind $j [@@@n]]
            ]
            bindidx = (+ $bindidx 1)
            KEYS_i = (+ $KEYS_i 1)
        ]
    ] [guibar]
]
KEYS_speclist = [
    KEYS_l = $arg2
    KEYS_i = 0
    guilistsplit n 2 $arg1 [
        guilist [
            guilist [ guitext (at $KEYS_l $KEYS_i) 0 ; guistrut 18 1 ]
            [newbinds@bindidx] = (searchspecbinds $n)
            guikeyfield [newbinds@bindidx] -12 [
                oldbinds = (searchspecbinds [@@n])
                looplist j $oldbinds [specbind $j ""]
                looplist j $[newbinds@@bindidx] [specbind $j [@@@n]]
            ]
            bindidx = (+ $bindidx 1)
            KEYS_i = (+ $KEYS_i 1)
        ]
    ] [guibar]
]
KEYS_editlist = [
    KEYS_l = $arg2
    KEYS_i = 0
    guilistsplit n 2 $arg1 [
        guilist [
            guilist [ guitext (at $KEYS_l $KEYS_i) 0 ; guistrut 18 1 ]
            [newbinds@bindidx] = (searcheditbinds $n)
            guikeyfield [newbinds@bindidx] -12 [
                oldbinds = (searcheditbinds [@@n])
                looplist j $oldbinds [editbind $j ""]
                looplist j $[newbinds@@bindidx] [editbind $j [@@@n]]
            ]
            bindidx = (+ $bindidx 1)
            KEYS_i = (+ $KEYS_i 1)
        ]
    ] [guibar]
]
