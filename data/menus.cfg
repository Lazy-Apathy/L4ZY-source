// Look. The Richer preset (hdrtonemap + automatic glare + forced shadow
// values) is gone. lookpreset stays 0 so a saved "1" cannot select it.
// LOOK_keep is only the anti-aliasing chain: clear postfx, glare off,
// FXAA in Native only when lookfxaa is 1 (off by default: it softened the
// textures) and DLAA/DLSS is not applied. It does not touch RT,
// NRD, lights, or shadow settings. HUD/chat stay after postfx.
// config.cfg and restore.cfg load after this file and may still define
// the old LOOK_apply. LOOK_retire puts that alias back without rewriting
// the other saved settings. The glare command itself stays for a later
// discrete HDR glare; Richer no longer turns it on.
lookpreset = 0
LOOK_keep = [
    watersubdiv 1
    clearpostfx
    glare 0
    if (&& (= $looktaa 0) $lookfxaa) [
        gfxusefxaa = 1
        if (>= (getvarmax hwrtngxmode) 4) [
            if (!= (hwrtngxmodeapplied) 0) [ gfxusefxaa = 0 ]
        ]
        if $gfxusefxaa [
            addpostfx fxaa 0 0 0
        ]
    ]
]
LOOK_apply = [ LOOK_keep ]
LOOK_retire = [
    // old "Richer" preset (lookpreset 1): retired silently
    lookpreset = 0
    LOOK_apply = [ LOOK_keep ]
]

// Graphics advanced: name column is text only (no mixed checkboxes).
GFX_name = [
    guilist [
        guitext $arg1
        guistrut 16 1
    ]
]

HUD_gap = [guistrut 2]

// ---------------------------------------------------------------------------
// Settings pages: one look everywhere (model: the Chat Translation page).
// - a section title (guisection) for each group, in the order a player looks;
// - one setting per line, or aligned columns (MENU_col, HUD_gap);
// - short grey notes (^f4) under what they explain, kept under ~75 letters;
// - buttons ending in "..." open another page;
// - a long page is cut into views shown as tabs at the top (MENU_tab): the
//   open view is green, the controls stay in the same page for the search;
// - every page has the same width (MENU_width) so the letters keep one size
//   (the menu window shrinks a page to fit its widest line).
// What is not relevant stays hidden (if ...), as before.
// ---------------------------------------------------------------------------
MENU_width = [ guistrut 66 1 ]
MENU_col = 25
// Graphics > Performance: shorter label column, the choices carry a short
// explanation ("Transformer (sharper, slower)").
GFX_perfcol = 14
// Graphics > Performance: profiles Ultra / High / Medium / Low, from the best
// picture to the fastest. One value per setting, in the order of GFX_profvars.
// Ultra = the values the game uses today (data/hwrt.cfg gives hwrtdlights 4,
// hwrtglowdlights 8, hwrtskyrays 1, hwrtskytemporal 32 before config.cfg).
// A lower profile never raises what a higher one lowered. Soft shadows and their
// rays / denoiser are set too (Graphics > Ray tracing; Low turns them off). The active profile is
// found by comparing the current values (Custom = none): nothing is stored,
// nothing waits. A value is only set when it differs (some settings reload
// textures when set).
GFX_profvars = "hwrtquality hwrtdlsscnn hwrtskyopaque hwrtnrdlight hwrtvelstatic hwrtskyrange hwrtrtadapt hwrtnrd hwrtskyrays hwrtskytemporal hwrtskyfilter hwrtsundisk hwrtdlights hwrtglowdlights hwrtdiffupscale hwrtdiffmipbias hwrtsoftshadowrays hwrtsoftsigma hwrtsoftsigmahistory hwrtsoftshadows"
GFX_prof0 = "2 0 0 0 0 0 0 1 1 32 1 0 4 8 2 0 2 1 5 2"
GFX_prof1 = "2 1 1 1 1 0 0 1 1 32 1 0 4 8 2 0 2 1 5 2"
GFX_prof2 = "1 1 1 2 1 1024 1 1 1 32 1 0 3 4 2 0 1 1 5 2"
GFX_prof3 = "0 1 1 2 1 1024 1 1 1 32 1 0 2 2 2 0 1 1 5 0"
GFX_profis = [
    GFX_pv = (getalias (concatword "GFX_prof" $arg1))
    GFX_pr = 1
    loop GFX_pi (listlen $GFX_profvars) [
        if (!=f $(at $GFX_profvars $GFX_pi) (at $GFX_pv $GFX_pi)) [ GFX_pr = 0 ]
    ]
    result $GFX_pr
]
GFX_profwhich = [
    GFX_pw = 4
    loop GFX_pp 4 [ if (= $GFX_pw 4) [ if (GFX_profis $GFX_pp) [ GFX_pw = $GFX_pp ] ] ]
    result $GFX_pw
]
GFX_profapply = [
    if (&& (>= $arg1 0) (<= $arg1 3)) [
        GFX_pv = (getalias (concatword "GFX_prof" $arg1))
        loop GFX_pi (listlen $GFX_profvars) [
            GFX_pn = (at $GFX_profvars $GFX_pi)
            if (!=f $$GFX_pn (at $GFX_pv $GFX_pi)) [ do (concat $GFX_pn (at $GFX_pv $GFX_pi)) ]
        ]
    ]
]
GFX_prof = 0
gfxperftab = 0
// MENU_tab VAR VALUE "Label": one view of a page (the open one is green).
MENU_tab = [
    guistayopen [
        guibutton (? (= (getalias $arg1) $arg2) (concatword "^f0" $arg3) $arg3) (concat $arg1 "=" $arg2) 0
    ]
]
gfxtab = 0
displaytab = 0
audiotab = 0
consoletab = 0
recordtab = 0
friendsview = 0
MENU_resetask = 0

