// Master page: client number after each name; per-player actions are icons, and the hint line
// spells out the action (and the player) while the mouse is over an icon.
masterhintlast = ""
masterhintmillis = 0
masterhintsave = [
    if (!=s $guirolloveraction "") [
        masterhintlast = $guirolloveraction
        masterhintmillis = (getmillis 1)
    ]
]
masterhinttext = [
    local a n c i who
    a = $masterhintlast
    n = (listlen $a)
    c = (at $a 0)
    if (> (- (getmillis 1) $masterhintmillis) 150) [n = 0]
    i = (? (|| (=s $c "spectator") (=s $c "setmaster")) 2 1)
    who = (concatword (getclientname (at $a $i)) " (" (at $a $i) ")")
    if (&& (= $n 2) (=s $c "kick")) [result (concat "^f3Kick" $who "from the server")] [
    if (&& (= $n 3) (=s $c "spectator")) [result (? (at $a 1) (concat "Make" $who "a spectator") (concat "Let" $who "play again"))] [
    if (&& (= $n 3) (=s $c "setteam")) [result (concat "Move" $who "to team" (at $a 2))] [
    if (&& (= $n 3) (=s $c "setmaster")) [result (? (at $a 1) (concat "Give master to" $who) (concat "Take master from" $who))] [
    result "^f4Point at an icon to see what it does"]]]]
]
newgui master [
    guititle "Master"
  guistayopen [
    guilist [
        if (ismaster (getclientnum)) [
            guibutton "relinquish master" "setmaster 0"
        ] [
            guibutton "claim master" "setmaster 1"
        ]
        guibar
        guitext (masterhinttext)
    ]
    guilist [
        guitext "mastermode: "
        mm = (getmastermode)
        guiradio "open (0) " mm 0 "mastermode 0"
        guiradio "veto (1) " mm 1 "mastermode 1"
        guiradio "locked (2) " mm 2 "mastermode 2"
        guiradio "private (3) " mm 3 "mastermode 3"
    ]
    guibar
    // bots: added with a style; on a clan server Tiny Apa bots stay Tiny Apa whoever's game runs them
    guitext "add a bot, skill"
    guislider masterbotskill 50 101
    guilist [
        guibutton "Add bot: Classic   " [addbot $masterbotskill classic]
        guibutton "Add bot: Tiny Apa   " [addbot $masterbotskill tinyapa]
        guibutton "remove a bot" [delbot]
    ]
    if (tinyapaserver) [
        guitext "^f4Tiny Apa bots stay Tiny Apa; other bots follow each player's bots play." 0
    ] [
        guitext "^f4Tiny Apa on add: only on an L4ZY server. Here bots follow bots play." 0
    ]
    guibar
    guirolloveraction = ""
    looplist cn (listclients 0 0) [
        guilist [
            // the player you are watching as a spectator: eye instead of the player icon
            guitext (concatword (getclientname $cn) " (" $cn "): ") (? (= $cn (getfollow)) "../../data/following.png" (getclienticon $cn))
            guibutton "" [kick @cn] "../../data/master_kick.png"
            guibutton "" [spectator @(= (isspectator $cn) 0) @cn] "../../data/master_spectator.png"
            if (m_teammode (getmode)) [
                guibutton "" [setteam @cn @(? (=s (getclientteam $cn) "good") "evil" "good")] "../../data/master_team.png"
            ]
            if (ismaster $cn) [
                guibutton "" [setmaster 0 @cn] "../../data/master_take.png"
            ] [
                guibutton "" [setmaster 1 @cn] "../../data/master_give.png"
            ]
        ]
    ]
    masterhintsave
  ]
] 0

