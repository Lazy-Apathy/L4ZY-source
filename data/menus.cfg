newgui record [
    guititle "RECORD"
    guistrut 0.1
    guistayopen [
        if $matchrecord [
            guibutton "Match Recording: ON" [togglematchrecord]
        ] [
            guibutton "Match Recording: OFF" [togglematchrecord]
        ]
    ]
    guitext (concatword "Quality: " (matchrecqname))
    guislider matchrecquality
    guitext "Videos to Keep (oldest deleted automatically)"
    guislider matchkeep
    guibar
    guitext "Saved in My Games / L4ZY / recordings"
    guistayopen [ guibutton "Open Folder" [openfolder recordings] 0 ]
    if (> (nummatchrecs) 0) [
        loop i (nummatchrecs) [
            guilist [
                guitext (matchrecname $i)
                guistayopen [ guibutton "Extract" [matchrecextract @i] ]
            ]
        ]
    ] [
        guitext "No Recordings Yet"
    ]
    guitext "Extract copies the file"
    guibar
    guistayopen [
        if $demohdrecord [
            guibutton "Demo + HD Aim: ON" [toggledemorecord]
        ] [
            guibutton "Demo + HD Aim: OFF" [toggledemorecord]
        ]
    ]
    guitext "Aim recorded on this machine, not server truth"
    guitext "Demos to Keep (oldest deleted automatically)"
    guislider demokeep
    guitext "Put both files in this folder (same names, not a subfolder)"
    guistayopen [ guibutton (localdemofolder) [openfolder demo] 0 ]
    guitext "The game's demo folder works too"
    if (> (numlocaldemos) 0) [
        loop i (numlocaldemos) [
            guilist [
                guitext (localdemoname $i)
                guistayopen [ guibutton "Play" [playlocaldemo @i] ]
                guistrut 2
                guistayopen [ guibutton "Extract" [localdemoextract @i] ]
            ]
        ]
    ] [
        guitext "No Local Demos Yet"
    ]
    guitext "Extract copies the .dmo and the HD file together"
] 0


