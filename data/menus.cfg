                guistrut 3
                guibutton "No" [ MENU_resetask = 0 ] 0
            ]
        ] [
            guibutton "Restore defaults (clears all settings)..." [ MENU_resetask = 1 ]
        ]
    ]
] 0

// Import settings from another client (Sauerbraten, older L4ZY clients...).
// L4ZY.exe does the copy before the game starts, never while it runs.
importsel = -2
importdir = ""
newgui importsettings [
    guititle "Import settings"
    importsrcrefresh
    guistrut 0.3
    if (= (importsrccount) 0) [
        guitext "^f4No other client found in My Games." 0
    ]
    guistayopen [
        loop i (importsrccount) [
            guibutton (concatword (if (= $importsel $i) [result "^f0> "] [result ""]) (importsrclabel $i)) [importsel = @i]
        ]
        guibutton (concatword (if (= $importsel -1) [result "^f0> "] [result ""]) "Another folder (type it below)") [importsel = -1]
    ]
    guistayopen [
        guifield importdir 50 [importsel = -1]
    ]
    guibar
    if (>= $importsel -1) [
        if (= $importsel -1) [
            guitextbox (concatword "^f4From: " (guifieldtext importdir)) 50 1
        ] [
            guitextbox (concatword "^f4From: " (importsrcfolder $importsel)) 50 1
        ]
        guibutton (if (importrestartable) [result "^f0Import and restart"] [result "^f0Import at next start"]) [importsettingsfrom $importsel (guifieldtext importdir)]
    ] [
        guitext "^f4Pick a client above." 0
    ]
    if (strcmp (importlastresult) "") [] [
        guitextbox (concatword "^f4Last time: " (importlastresult)) 50 2
    ]
] 0

// Search in the settings: by name or keyword (French or English).
// Results are the real controls; the grey line opens the page they are on.
settingsquery = ""
newgui settingsearch [
    guititle "Search settings"
    guistayopen [
        guilist [
            guitext "Search: " 0
            guifield settingsquery 30
        ]
    ]
    guistrut 0.2
    guistayopen [
        do (settingsearchgui (guifieldtext settingsquery))
    ]
    guistrut 0.3
    guibutton "^f2Ask the assistant (AI)..." [assistq = (guifieldtext settingsquery); showgui assistant]
] 0

// Settings assistant: the local AI (the one that translates the chat) answers
// questions about the settings. What it proposes is checked by the game and
// only changes when you click Apply.
assistq = ""
assistant = [showgui assistant]
newgui assistant [
    guititle "Settings assistant (local AI)"
    guistayopen [
        do (assistantgui)
    ]
    guistrut 0.4
    guistayopen [
        guiinputfield assistq 60 [assistantask $assistq; assistq = ""]
        guilist [
            guibutton "^f2Send" [assistantask (guifieldtext assistq); assistq = ""]
            guistrut 2
            guibutton "New conversation" [assistantclear]
            guistrut 2
            guicheckbox "Think first (slower, smarter)" assistantthink
        ]
    ]
] 0

newgui optionscfg [
    guititle "autoexec.cfg"
    guistrut 0.1
    showfileeditor "autoexec.cfg" -64 13
] 0

newgui hud [
