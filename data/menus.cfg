// standard menu definitions
// don't modify, add personal menus to autoexec.cfg instead

// Only for testing. This will break stuff, delete config.cfg after use.
reui = [exec data/menus.cfg; echo "Menus Reinitialized"]

togglemainmenu = [
    || (cleartexgui) [cleargui 1] [showgui main]
]

bind ESCAPE [togglemainmenu]

checkrolloveraction = [
    if (>= (strstr $guirolloveraction $arg1) 0) [
        if (>= $numargs 2) [arg2] [result $guirolloveraction]
    ]
]

chooseplayermodel = [guirolloveraction = (playermodelbutton $playermodel); showgui playermodel]

// Section title with a bit of air. arg1 = label (no brackets).
guisection = [
    guistrut 0.45
    guititle $arg1
    guistrut 0.18
]

friendhudtitle = [
    if (< $arg1 0) [
        guitext (concatword "^f7" $arg2) 0
    ] [
        guitext (concatword "^f" $arg1 $arg2) 0
    ]
]

friendcolorpicks = [
    guilist [
        guilist [
            guilist [
                guicolorswatch $arg1 -1
                loop i 5 [guicolorswatch $arg1 $i]
            ]
            guilist [
                loop i 5 [guicolorswatch $arg1 (+ 5 $i)]
            ]
        ]
    ]
]

friendsoverlay = [
    friendsync
    guititle "Friends"
    guistrut 0.08
    guistayopen [
        guilist [
            guifield friendaddname 15 [addfriend]
            if (|| (!=s $friendaddname "") (&& (=s (textfocus) "friendaddname") (!=s (textcurrentline) ""))) [
                guistrut 2
                guibutton "Add" [addfriend] 0
            ]
        ]
    ]
    guistrut 0.08
    guilist [
        guitext "^f4Online" 0
        guistrut 2
        guistayopen [
            guibutton "Refresh" [friendrefresh] 0
        ]
    ]
    if $numfriendsonline [
        loop i (min $numfriendsonline 12) [
            guibutton (getfriendonlinename $i) (concat joinfriend $i) 0
            if (!=s (getfriendonlinemap $i) "") [
                guitext (concatword "^f4" (getfriendonlinemap $i)) 0
            ]
        ]
    ] [
        if (|| $numfriends (!=s $clantag "")) [
            guitext $friendscanmsg 0
        ] [
            guitext "^f4Nobody yet" 0
        ]
    ]
]

friendspanel = [
    friendsync
    guisection "Friends"
    guistayopen [
        guilist [
            guitext "Nick" 0
            guistrut 2
            guifield friendaddname 15 [addfriend]
            if (|| (!=s $friendaddname "") (&& (=s (textfocus) "friendaddname") (!=s (textcurrentline) ""))) [
                guistrut 2
                guibutton "Add" [addfriend] 0
            ]
        ]
        guilist [
            guitext "Clan" 0
            guistrut 2
            guifield clantag 10
        ]
        guistrut 0.12
        if $numfriends [
            loop i (min $numfriends 12) [
                guilist [
                    guitext (getfriend $i) 0
                    guistrut 2
                    guibutton "x" (concat delfriend $i) 0
                ]
            ]
            if (> $numfriends 12) [guitext "^f4..." 0]
        ]
        if $numfriendshere [
            guibar
            guitext "^f4Here" 0
            loop i $numfriendshere [
                guilist [
                    guitext (getfriendhere $i) 0
                    guitext (getfriendhererel $i) 0
                ]
            ]
        ]
    ]
    guibar
    guistayopen [
        guilist [
            guitext "Online" 0
            guistrut 2
            guibutton "Refresh" [friendrefresh] 0
        ]
    ]
    if $numfriendsonline [
        loop i (min $numfriendsonline 10) [
            guilist [
                guibutton (getfriendonlinename $i) (concat joinfriend $i) 0
                if (!=s (getfriendonlinemap $i) "") [
                    guitext (concatword "^f4" (getfriendonlinemap $i)) 0
                ]
            ]
        ]
    ] [
        if (|| $numfriends (!=s $clantag "")) [
            guitext $friendscanmsg 0
        ] [
            guitext "^f4Nobody yet" 0
        ]
    ]
]

newgui main [
    guibanner 1
    guilist [
        guilist [
            guistrut 0.4
            guititle "L4ZY"
            guitext "Sauerbraten RT" 0
            guistrut 0.5
            guibutton "Find a Server" "showgui servers"
            if (isconnected) [
                if (|| $editing (m_edit (getmode))) [
                    guibutton "Editing" "showgui editing"
                ]
                guibutton "Change Map / Mode" "showgui gamemode"
                guibutton "Switch Team" [if (strcmp (getteam) "good") [team evil] [team good]]
                guibutton "Spectate" [spectator (! (isspectator (getclientnum)))]
                guibutton "Master" [showgui master]
            ] [
                guibutton "Bot Match" "showgui botmatch"
                guibutton "Campaign" "showgui campaign"
            ]
            guibutton "Options" "showgui options"
            guibutton "Chat Translation" [showgui "traduction"]
            guibutton "About" "showgui about"
            if (isconnected) [
                guibutton "Disconnect" "disconnect"
            ] [
                guibutton "Quit" "quit"
            ]
            guistrut 0.45
            tupdatesync
            if (= $tupdateavail 3) [
                guistayopen [ guibutton "^f0Restart to update" [tupdaterestart] 0 ]
            ] [
                if (= $tupdateavail 2) [
                    guistayopen [ guibutton (tupdatelabel) [showgui updates] 0 ]
                ] [
                    if (= $tupdateavail 1) [
                        guistayopen [ guibutton "^f0Update available" [showgui updates] 0 ]
                    ]
                ]
            ]
            guitext (concatword "^f4L4ZY " (tupdateinstalled)) 0
            guibutton "^f4Updates" [showgui updates] 0
            guistrut 16 1
            guibannersplit
        ]
        guistrut 2
        guibannercenter 0
        guilist [
            guistayopen [
                playerpreviewtint $mycolor
                guiplayerpreview (if $customplayermodel [result 5] [result $playermodel]) 0 6 [cyclemycolor] 6.5 0 ""
                playerpreviewtint -1
                guistrut 0.2
                friendcolorpicks mycolor "My colour"
            ]
            guistrut 0.15
            newname = (getname)
            guifield newname 15 [name $newname]
            guibutton (playermodelname) [chooseplayermodel] 0
        ]
    ]
    guifloat 0.02 0.10 [
        friendsoverlay
    ]
] 0

// Mises a jour L4ZY. Tout part d'un clic : rien ne ferme une partie tout
// seul. Le redemarrage automatique n'a lieu qu'apres "Update and restart" et
// seulement si le joueur attend ici, hors partie.
newgui updates [
    tupdatesync
    guitext (concatword "Installed: ^f0L4ZY " (tupdateinstalled) "^f7   channel: " (tupdatechannel)) 0
    if (! (tupdateservice)) [
        guitext "^f3Update service not running. Start the game with L4ZY.exe." 0
    ]
    guitextbox (tupdatemsg) 60 1
    guibar
    if (= $tupdateavail 0) [
        guistayopen [ guibutton "Check for updates" [tupdatecheck] ]
    ]
    if (= $tupdateavail 1) [
        guistayopen [ guibutton (tupdatelabel) [tupdateapply] ]
        guitext "^f4Downloads in the background. The game restarts only when you say so." 0
        guistayopen [ guibutton "Check again" [tupdatecheck] ]
    ]
    if (= $tupdateavail 2) [
        guitext (tupdatelabel) 0
        guitext "^f4You can keep playing. Nothing is replaced until the game restarts." 0
    ]
    if (= $tupdateavail 3) [
        guistayopen [ guibutton "^f0Restart now to install" [tupdaterestart] ]
        if (isconnected) [
            guitext "^f4You are in a game: restart when you are ready." 0
        ] [
            if (tupdatewantrestart) [ tupdaterestart ]
        ]
    ]
] "Updates"

newgui about [
    guititle "About"
    guitext "L4ZY" 0
    guitext "Sauerbraten with ray tracing and chat translation" 0
    guitext "Cube 2: Sauerbraten  2020 edition + patches" 0
    guitext (concatword "L4ZY " (tupdateinstalled) "   (translation client " $tradversion ")") 0
    guitext [by Wouter "Aardappel" van Oortmerssen, Lee "eihrul" Salzman,] 0
    guitext [Mike "Gilt" Dysart, Robert "baby-rabbit" Pointon,] 0
    guitext [John "geartrooper" Siar, Quinton "Quin" Reeves, and others] 0
    guitext "(for a full list of contributors see the readme)" 0
    guitext "http://sauerbraten.org/"     0
] 0

