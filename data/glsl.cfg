//
//////////////////////////////////////////////////////////////////////

shader 0 "fogged" [
    //:fog
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 camprojmatrix;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0;
    uniform float hwrthdrlin;
    uniform vec4 decalmod;
    void main(void)
    {
        vec4 tex = texture2D(tex0, texcoord0);
        vec4 tint = color;
        if(hwrthdrlin > 0.5 && decalmod.x < 0.5)
        {
            tex.rgb = @(srgb2lin "tex.rgb");
            tint.rgb = @(srgb2lin "tint.rgb");
        }
        gl_FragColor = vec4(tint.rgb * tex.rgb, tint.a * tex.a);
    }
]

shader 0 "foggednotexture" [
    //:fog
    attribute vec4 vvertex, vcolor;
    uniform mat4 camprojmatrix;
    varying vec4 color;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        color = vcolor;
    }
] [
    uniform float hwrthdrlin;
    varying vec4 color;
    void main(void)
    {
        vec3 tint = color.rgb;
        if(hwrthdrlin > 0.5) tint = @(srgb2lin "tint");
        gl_FragColor = vec4(tint, color.a);
    }
]

shader 0 "fogoverlay" [
