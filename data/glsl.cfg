    varying vec2 texcoord0, texcoord1;
    varying vec2 bounds;
    uniform sampler2D tex0, tex1;
    uniform float hwrthdrlin;
    uniform float hdrlightfix;
    uniform float hdrmatcol; uniform vec4 hdrjour; uniform float hdrjourt[24];
    void main(void)
    {
        vec4 diffuse = texture2D(tex0, texcoord0);
        vec3 tint = color.rgb;
        if(hwrthdrlin > 0.5)
        {
            diffuse.rgb = @(srgb2lin "diffuse.rgb");
            tint = @(srgb2lin "tint");
        }
        diffuse.rgb *= 2.0;
        vec4 lm = texture2D(tex1, texcoord1);
        @(hdrlightchroma "lm.rgb")
        @(hdrmatcouleur "diffuse.rgb" "lm.rgb" "1.0") @(hdrjourmat "diffuse.rgb" "lm.rgb" "1.0")
        lm.rgb *= tint;
        lm.a *= color.a;
        lm.rgb *= lm.a;
