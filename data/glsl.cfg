    varying vec4 color;
    varying vec2 texcoord0, texcoord1;
    varying vec2 bounds;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        color = vcolor;
        texcoord0 = vtexcoord0;
        texcoord1 = vtexcoord1 * @lmcoordscale;
