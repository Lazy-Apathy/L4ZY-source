// standard shader definitions

lazyshader = [
    defershader $arg1 $arg2 [
        shader @arg1 @arg2 [@@arg3] [@@arg4]
    ]
]

lmcoordscale = (divf 1 32767)

// IEC 61966-2-1 sRGB EOTF, RGB only. Not for normals, depth, masks, alpha or lightmaps.
srgb2lin = [
    result (format "mix(%1*(1.0/12.92), pow((%1+0.055)*(1.0/1.055), vec3(2.4)), step(vec3(0.04045), %1))" $arg1)
]

// Lot 4, classic lighting only. Lightmaps, dynamic lights and model light colours
// were multiplied with the encoded texture before the display EOTF, so their colour
// on screen was the colour of pow(light, 2.2). Luminance stays the lot 3 one.
// Neutral light is unchanged. Not for textures, masks, glow or alpha.
// Lot 5 (hdrlightfix 2): the same history for the luminance of overbright light.
// The multiplier of the albedo is 2 x this light (colorparams, grass and models double
// it). Above 1.25 its luminance takes pow(L, 2.2) as on the historical display; below
// 0.8 it is unchanged; in between a C1 ramp in log (exp(1.2 s(ln L)), s quadratic).
hdrlightchroma = [
    result (format "if(hwrthdrlin > 0.5 && hdrlightfix > 0.5) { vec3 hlc = max(%1, vec3(0.0)); float hly = dot(hlc, vec3(0.2126, 0.7152, 0.0722)); vec3 hlp = pow(hlc, vec3(2.2)); float hlq = dot(hlp, vec3(0.2126, 0.7152, 0.0722)); if(hlq > 1e-10) %1 = hlp * (hly / hlq); if(hdrlightfix > 1.5 && hly > 0.4) { float hlx = log(2.0 * hly); %1 *= exp(1.2 * (hlx >= 0.22314355 ? hlx : (hlx + 0.22314355) * (hlx + 0.22314355) * 1.1203549)); } }" $arg1)
]

// Lot 7 (hdrmatcol, native HDR, classic lighting only): daylight material colours.
// %1 = decoded albedo (changed in place), %2 = the light that multiplies it (after
// hdrlightchroma), %3 = the remaining scalar multiplier (2 x for the world shader).
// The albedo is moved away from its own luminance (luminance kept, hue kept in linear
// RGB) by at most hdrmat_gain (+15 %), weighted by:
// - albedo chroma (Oklab C/L): 0 for neutrals (< 0.05), 1 from 0.085 to 0.13, 0 again
//   above 0.19, so greys, whites, snow and already vivid colours are left alone (the
//   triforts stone is 0.02: its colour comes from the torches, not from the texture);
// - light chroma ((max - min) / max of %2): 1 up to 0.55, 0 from 0.80: strongly coloured
//   light (torches 0.7-0.97) is left alone; the warm Academy sun is 0.2-0.34;
// - light intensity (2 x luminance of %2, the albedo multiplier): 0 below 0.5, 1 from 1.0:
//   direct daylight (Academy sun 1.1-4), not the moonlight of triforts (0.1-0.45) nor the
//   ambient light of shaded corners (0.5-0.8), whose colours stay the lot 6 ones;
// - lit scene luminance: 0 in the shadows (< 0.02), 1 from 0.04, back to 0 above 0.8-1.6.
// Artistic restitution, measured against the base SDR on Academy (lot 7 BILAN).
hdrmatcouleur = [
    result (format "if(hdrmatcol > 0.001) { vec3 hma = max(%1, vec3(0.0)); float hmy = dot(hma, vec3(0.2126, 0.7152, 0.0722)); vec3 hml = max(%2, vec3(0.0)); float hmx = max(hml.r, max(hml.g, hml.b)); float hmn = hmx > 1e-6 ? (hmx - min(hml.r, min(hml.g, hml.b))) / hmx : 1.0; float hmi = 2.0 * dot(hml, vec3(0.2126, 0.7152, 0.0722)); float hmlit = hmy * dot(hml, vec3(0.2126, 0.7152, 0.0722)) * (%3); if(hmy > 1e-6 && hmlit > 0.02) { vec3 hmq = pow(max(vec3(dot(hma, vec3(0.4122214708, 0.5363325363, 0.0514459929)), dot(hma, vec3(0.2119034982, 0.6806995451, 0.1073969566)), dot(hma, vec3(0.0883024619, 0.2817188376, 0.6299787005))), vec3(1e-12)), vec3(1.0 / 3.0)); float hmL = dot(hmq, vec3(0.2104542553, 0.7936177850, -0.0040720468)); float hmc = length(vec2(dot(hmq, vec3(1.9779984951, -2.4285922050, 0.4505937099)), dot(hmq, vec3(0.0259040371, 0.7827717662, -0.8086757660)))) / max(hmL, 1e-6); float hmlg = log(hmlit); float hmw = smoothstep(0.05, 0.085, hmc) * (1.0 - smoothstep(0.13, 0.19, hmc)) * (1.0 - smoothstep(%4, %5, hmn)) * smoothstep(0.5, 1.0, hmi) * smoothstep(-3.912023, -3.218876, hmlg) * (1.0 - smoothstep(-0.223144, 0.470004, hmlg)); float hms = 1.0 + %6 * hdrmatcol * hmw; float hmm = min(hma.r, min(hma.g, hma.b)); if(hmm < hmy) hms = min(hms, hmy / (hmy - hmm)); %1 = vec3(hmy) + hms * (hma - vec3(hmy)); } }" $arg1 $arg2 $arg3 $hdrmat_ln0 $hdrmat_ln1 $hdrmat_gain)
]
hdrmat_ln0 = 0.55
hdrmat_ln1 = 0.80
hdrmat_gain = 0.15

// Lot 8 (hdrjour, native HDR, classic lighting only): daylight response of lit materials.
// The common output curve (lot 6) has a steep foot (log slope ~1.5, the validated depth
// of the night) and a flat top (~0.55 above scene 0.45). A material lit by daylight
// spans both: its darker texels were drawn too dark and gritty, the sand too flat.
// For a surface lit by strong, weakly coloured light, the albedo is multiplied by
// G(Y) = C^-1(T(Y)) / Y, so that the output of the common curve C becomes T(Y): the
// line k.Y from the origin tangent to C (log slope 1: the scene contrast, as the
// albedo ratios of the map), a foot of slope 1.5 below ~0.01 and a soft limit at the
// peak. T >= C, so never darker than lot 7. %1 = albedo (changed in place),
// %2 = its light, %3 = the remaining scalar multiplier. Y = albedo luminance x light
// luminance x %3 x exposure (hdrjour.y). ln G is tabulated on 24 points in ln Y
// (hdrjourt, hdrout.cpp) and read with a Catmull-Rom spline. Weight:
// - light intensity (2 x luminance of %2): 0 up to 0.85, 1 from 1.10: the Academy sun
//   (1.1-4); its shade (0.5-0.83), snow in ambient light (0.88) and the moon of triforts
//   (0.1-0.45) keep the lot 7 response;
// - light chroma ((max - min) / max): 1 up to 0.45, 0 from 0.65: torches (0.7-0.97).
hdrjourmat = [
    result (format "if(hdrjour.x > 0.5) { vec3 hja = max(%1, vec3(0.0)); vec3 hjl = max(%2, vec3(0.0)); float hjx = max(hjl.r, max(hjl.g, hjl.b)); float hjn = hjx > 1e-6 ? (hjx - min(hjl.r, min(hjl.g, hjl.b))) / hjx : 1.0; float hjll = dot(hjl, vec3(0.2126, 0.7152, 0.0722)); float hjw = smoothstep(%4, %5, 2.0 * hjll) * (1.0 - smoothstep(%6, %7, hjn)); if(hjw > 0.0) { float hjY = dot(hja, vec3(0.2126, 0.7152, 0.0722)) * hjll * (%3) * hdrjour.y; float hjf = clamp((log(max(hjY, 1e-9)) - hdrjour.w) * hdrjour.z, 0.0, 23.0); float hjk = min(floor(hjf), 22.0); float hjt = hjf - hjk; float hj0 = hdrjourt[int(max(hjk - 1.0, 0.0))]; float hj1 = hdrjourt[int(hjk)]; float hj2 = hdrjourt[int(hjk + 1.0)]; float hj3 = hdrjourt[int(min(hjk + 2.0, 23.0))]; float hjg = 0.5 * (2.0 * hj1 + (hj2 - hj0) * hjt + (2.0 * hj0 - 5.0 * hj1 + 4.0 * hj2 - hj3) * hjt * hjt + (3.0 * hj1 - hj0 - 3.0 * hj2 + hj3) * hjt * hjt * hjt); %1 *= exp(hjw * hjg); } }" $arg1 $arg2 $arg3 $hdrjour_i0 $hdrjour_i1 $hdrjour_n0 $hdrjour_n1)
]
hdrjour_i0 = 0.85
hdrjour_i1 = 1.10
hdrjour_n0 = 0.45
hdrjour_n1 = 0.65

shader 0 "null" [
    attribute vec4 vvertex;
    void main(void)
    { 
        gl_Position = vvertex;
    }
] [
    void main(void) 
    {
        gl_FragColor = vec4(1.0, 0.0, 1.0, 1.0);
    }
]

///////////////////////////////////////////////////
//
// used for rendering to the HUD
//
///////////////////////////////////////////////////

screentexcoord = [
    result [
        uniform vec4 screentexcoord@arg1;
        #define vtexcoord@arg1 (vvertex.xy * screentexcoord@arg1.xy + screentexcoord@arg1.zw)
    ]
]

shader 0 "hud" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0;
    uniform vec4 hdroutui;
    vec3 hdroutlin(vec3 e)
    {
        return mix(e / 12.92, pow((e + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), e));
    }
    void main(void)
    {
        vec4 c = color * texture2D(tex0, texcoord0);
        if(hdroutui.x > 0.5)
        {
            vec3 enc = (hdroutui.z > 0.5 && c.a > 0.001) ? clamp(c.rgb / c.a, 0.0, 1.0) : clamp(c.rgb, 0.0, 1.0);
            vec3 lin = hdroutlin(enc);
            c.rgb = (hdroutui.z > 0.5) ? lin * c.a * hdroutui.y : lin * hdroutui.y;
        }
        gl_FragColor = c;
    }
]

shader 0 "hudnotexture" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 hudmatrix;
    varying vec4 color;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        color = vcolor;
    }
] [
    varying vec4 color;
    uniform vec4 hdroutui;
    vec3 hdroutlin(vec3 e)
    {
        return mix(e / 12.92, pow((e + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), e));
    }
    void main(void)
    {
        vec4 c = color;
        if(hdroutui.x > 0.5)
        {
            vec3 enc = (hdroutui.z > 0.5 && c.a > 0.001) ? clamp(c.rgb / c.a, 0.0, 1.0) : clamp(c.rgb, 0.0, 1.0);
            vec3 lin = hdroutlin(enc);
            c.rgb = (hdroutui.z > 0.5) ? lin * c.a * hdroutui.y : lin * hdroutui.y;
        }
        gl_FragColor = c;
    }
]

shader 0 "hudrgb" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 hudmatrix;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = hudmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0;
    uniform vec4 hdroutui;
    vec3 hdroutlin(vec3 e)
    {
        return mix(e / 12.92, pow((e + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), e));
    }
    void main(void)
    {
        vec4 c;
        c.rgb = color.rgb * texture2D(tex0, texcoord0).rgb;
        c.a = color.a;
        if(hdroutui.x > 0.5)
        {
            vec3 enc = (hdroutui.z > 0.5 && c.a > 0.001) ? clamp(c.rgb / c.a, 0.0, 1.0) : clamp(c.rgb, 0.0, 1.0);
            vec3 lin = hdroutlin(enc);
            c.rgb = (hdroutui.z > 0.5) ? lin * c.a * hdroutui.y : lin * hdroutui.y;
        }
        gl_FragColor = c;
    }
]

