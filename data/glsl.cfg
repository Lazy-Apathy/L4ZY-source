shader 0 "skybox" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0;
    uniform float hwrthdrlin, hdrskyfix;
    void main(void)
    {
        vec4 sky = texture2D(tex0, texcoord0);
        vec3 tint = color.rgb;
        if(hwrthdrlin > 0.5) sky.rgb = @(srgb2lin "sky.rgb");
        // Lot 6 (hdrskyfix 1): skyboxcolour / cloudboxcolour / cloudcolour are 8-bit display
        // colours, multiplied with the encoded texture before the display EOTF; decoded here.
        // hdrskyfix 2: a saturated blue sky has the luminance of a shadow (blue weighs 0.07),
        // so the lot 6 curve treats it as one. There it takes the lot 6 bright-tone gain
        // (1.7 = LOT6_GAIN, hdrout.cpp). Neutral clouds and peaks are left to the curve;
        // dark sky pixels (max channel below 0.025, night skyboxes) are left as they are.
        if(hwrthdrlin > 0.5 && hdrskyfix > 0.5) tint = @(srgb2lin "tint");
        vec3 lit = tint * sky.rgb;
        if(hwrthdrlin > 0.5 && hdrskyfix > 1.5)
        {
            float skym = max(lit.r, max(lit.g, lit.b));
            float skyy = dot(lit, vec3(0.2126, 0.7152, 0.0722));
            float skyw = smoothstep(0.025, 0.1, skym) * smoothstep(0.3, 0.7, 1.0 - skyy / max(skym, 1e-6));
            lit *= 1.0 + 0.7 * skyw;
        }
        gl_FragColor = vec4(lit, color.a * sky.a);
    }
]

shader 0 "skyboxglare" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 skymatrix;
    varying vec4 color;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        color = vcolor;
        texcoord0 = vtexcoord0;
    }
] [
    varying vec4 color;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    void main(void)
    {
        vec4 glare = texture2D(tex0, texcoord0) * color;
        gl_FragColor.rgb = vec3(dot(glare.rgb, vec3(10.56, 10.88, 10.56)) - 30.4);
        gl_FragColor.a = glare.a;
    }
]

shader 0 "skyfog" [
    attribute vec4 vvertex, vcolor;
    uniform mat4 skymatrix;
    varying vec4 color;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;
        color = vcolor;
    }
] [
    varying vec4 color;
    uniform float hwrthdrlin, hdrskyfix;
    void main(void)
    {
        gl_FragColor = color;
        // Lot 6: fogdomecolour / fogcolour are 8-bit display colours.
        if(hwrthdrlin > 0.5 && hdrskyfix > 0.5) gl_FragColor.rgb = @(srgb2lin "color.rgb");
    }
]

loop i 2 [
  lazyshader 0 (? $i "atmosphereglare" "atmosphere") [
    attribute vec4 vvertex;
    uniform mat4 skymatrix;
    varying vec3 camvec;
    void main(void)
    {
        gl_Position = skymatrix * vvertex;

        camvec = vvertex.xyz;
    }
  ] [
    uniform vec4 sunlight;
    uniform vec3 sundir;
    uniform vec3 sunweight;
    uniform vec3 sundiskcolor;
    uniform vec2 sundiskparams;
    uniform vec4 opticaldepthparams;
    uniform vec3 mieparams;
    uniform vec3 betarayleigh, betamie, betaozone;
    varying vec3 camvec;

    void main(void)
    {
        vec3 camdir = normalize(camvec);
        float costheta = dot(camdir, sundir);

        // sun disk
        float edgeoffset = max(1.0 - (1.0 - max(costheta, 0.0)*costheta)*sundiskparams.x, 0.0);
        // limb darken with distance to edge
        float limbdarken = sqrt(edgeoffset);
        // lighten edges for corona, but limit it to not interfere with limb darkening
        float corona = min(edgeoffset * sundiskparams.y, 1.0);
        corona = max(0.75 / (1.5 - corona * corona) - 0.5, 0.0);
        // apply limb darkening and corona to clamped sunlight color
        vec3 sundisk = sundiskcolor * limbdarken * corona;

        // optical depth along view ray
        float offset = camdir.z*opticaldepthparams.w;
        vec3 depth = sqrt(offset*offset + opticaldepthparams.xyz) - offset;
        vec3 rayleighweight = betarayleigh * depth.x;
        vec3 mieweight = betamie * depth.y;
        vec3 ozoneweight = betaozone * (depth.z - depth.x);

        // extinction of light along view ray
        vec3 viewweight = sunweight - (rayleighweight + mieweight + ozoneweight);
        vec3 extinction = (exp2(viewweight) - 1.0) / viewweight;

        @(? $i [
            // only glare sundisk, excluding other scattering
            // squared (by skipping gamma encode) to limit it
            gl_FragColor = vec4(sundisk * extinction, sunlight.a);
        ] [
            // calculate in-scattering
            float rphase = (1.5 + 0.5*costheta*costheta) * (3.0 / (16.0 * 3.14159265));
            float mphase = inversesqrt(mieparams.x + mieparams.y*min(costheta, mieparams.z));
            vec3 scatter = rayleighweight * rphase + mieweight * (mphase * mphase * mphase);

            // combine scattering and extinction with sundisk
            vec3 inscatter = (sunlight.rgb * scatter + sundisk) * extinction;

            // gamma encode
            gl_FragColor = vec4(sqrt(inscatter), sunlight.a);
        ])
    }
  ]
]

// Lot 1b family probe. Same srgb2lin helper as the scene shaders. Not a material.
// hdrfam.x: 0 std, 1 bump floor, 2 straight, 3 premul, 4 raw linear.
// hdrfam.y ambient, hdrfam.z colorparams scale. hdrlight.rgb lightmap, hdrlight.a NdotL.
lazyshader 0 "hdrfamprobe" (fsvs) (fsps [
    vec3 encoded = hdrsrc.rgb;
    vec3 lin = @(srgb2lin "encoded");
    vec3 lm = hdrlight.rgb;
    float ndotl = clamp(hdrlight.a, 0.0, 1.0);
    float ambient = hdrfam.y;
    float scale = hdrfam.z;
    vec3 outc = lin * scale * lm;
    if(hdrfam.x >= 0.5 && hdrfam.x < 1.5) outc = lin * scale * max(lm * ndotl, vec3(ambient));
    else if(hdrfam.x >= 1.5 && hdrfam.x < 2.5) outc = lin;
    else if(hdrfam.x >= 2.5 && hdrfam.x < 3.5) outc = lin * hdrsrc.a;
    else if(hdrfam.x >= 3.5) outc = hdrsrc.rgb;
    float a = (hdrfam.x >= 1.5 && hdrfam.x < 3.5) ? hdrsrc.a : 1.0;
    gl_FragColor = vec4(outc, a);
] [uniform vec4 hdrfam; uniform vec4 hdrsrc; uniform vec4 hdrlight;])

// Lot 1. ACES Narkowicz 2015, then IEC 61966-2-1 sRGB OETF. hdrexp.x = 2^stops.
// Relative scene units, not nits. No ] in these bodies.
lazyshader 0 "hdrpresent" (fsvs) (fsps [
    vec2 uv = vec2(texcoord0.x, hdrexp.y > 0.5 ? 1.0 - texcoord0.y : texcoord0.y);
    vec3 x = max(texture2D(tex0, uv).rgb, vec3(0.0)) * hdrexp.x;
    vec3 y = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    vec3 e = mix(y * 12.92, 1.055 * pow(max(y, vec3(0.0)), vec3(0.4166667)) - 0.055, step(vec3(0.0031308), y));
    gl_FragColor = vec4(e, 1.0);
] [uniform vec4 hdrexp;])

lazyshader 0 "hdrstamp" (fsvs) (fsps [
    float lx = gl_FragCoord.x - hdrstamp.x;
    float ly = gl_FragCoord.y - hdrstamp.y;
    float v = -1.0;
    if(ly >= 0.0 && ly < 48.0)
    {
        if(lx >= 8.0 && lx < 56.0) v = 0.18;
        else if(lx >= 64.0 && lx < 112.0) v = 1.0;
        else if(lx >= 120.0 && lx < 168.0) v = 4.0;
        else if(lx >= 176.0 && lx < 224.0) v = 16.0;
    }
    if(v < 0.0) discard;
    gl_FragColor = vec4(v, v, v, 1.0);
] [uniform vec4 hdrstamp;])

// Re-apply look after shaders load (autoexec runs too early) and after reloadshaders.
// A saved profile may have replaced LOOK_apply with the old Richer body.
LOOK_retire
LOOK_apply

