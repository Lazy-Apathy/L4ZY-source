    {
        gl_Position = camprojmatrix * vvertex;
        color = vcolor;
        texcoord0 = vtexcoord0;
    }
] [
    //:fog vec3(0.5)
    varying vec4 color;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    void main(void)
    {
        // Modulation factors, not colours. Blend writes 2*src*dst.
        // 128/255 stays ~0.502, so bullet.png corners and the fade gray
        // stay neutral (~1.004). srgb2lin would turn that gray into ~0.216
        // and darken the whole quad. Fog still targets vec3(0.5).
        vec4 diffuse = texture2D(tex0, texcoord0);
        gl_FragColor = mix(color, diffuse, color.a);
    }
]

