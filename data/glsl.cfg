////////////////////////////////////////////////
//
// model shaders
//
////////////////////////////////////////////////

// skeletal animation for dual quaternions

qtangentdecode = [
    ? $arg1 [
        vec4 qxyz = mquat.xxyy*mquat.yzyz, qxzw = vec4(mquat.xzw, -mquat.w);
        vec3 mtangent = (qxzw.yzw*mquat.zzy + qxyz.zxy)*vec3(-2.0, 2.0, 2.0) + vec3(1.0, 0.0, 0.0);
        vec3 mnormal = (qxzw.zwx*mquat.yxx + qxyz.ywz)*vec3(2.0, 2.0, -2.0) + vec3(0.0, 0.0, 1.0);
        // vec3 mtangent = cross(mquat.xyz, vec3(mquat.wz, -mquat.y))*2.0 + vec3(1.0, 0.0, 0.0);
        // vec3 mnormal = cross(mquat.xyz, vec3(mquat.y, -mquat.x, mquat.w))*2.0 + vec3(0.0, 0.0, 1.0);
    ] [
        vec3 mnormal = cross(mquat.xyz, vec3(mquat.y, -mquat.x, mquat.w))*2.0 + vec3(0.0, 0.0, 1.0);
    ]
]

skelanimdefs = [
    skelanimlength = (min (- $maxvsuniforms (+ $reservevpparams 10)) $maxskelanimdata)
    result [
        attribute vec4 vboneweight; 
        attribute vec4 vboneindex;
        //:uniform animdata
        uniform vec4 animdata[@@skelanimlength];
    ]
]

skelanim = [
    result [
        int index = int(vboneindex.x);
        @(if (= $arg1 1) [result [
            vec4 dqreal = animdata[index];
            vec4 dqdual = animdata[index+1];
        ]] [result [
            vec4 dqreal = animdata[index] * vboneweight.x;
            vec4 dqdual = animdata[index+1] * vboneweight.x;
            index = int(vboneindex.y);
            dqreal += animdata[index] * vboneweight.y;
            dqdual += animdata[index+1] * vboneweight.y;
            @(if (>= $arg1 3) [result [
                index = int(vboneindex.z);
                dqreal += animdata[index] * vboneweight.z;
                dqdual += animdata[index+1] * vboneweight.z;
            ]])
            @(if (>= $arg1 4) [result [
                index = int(vboneindex.w);
                dqreal += animdata[index] * vboneweight.w;
                dqdual += animdata[index+1] * vboneweight.w;
            ]])
            float len = length(dqreal);
            dqreal /= len;
            dqdual /= len;
        ]])

        vec4 mpos = vec4((cross(dqreal.xyz, cross(dqreal.xyz, vvertex.xyz) + vvertex.xyz*dqreal.w + dqdual.xyz) + dqdual.xyz*dqreal.w - dqreal.xyz*dqdual.w)*2.0 + vvertex.xyz, vvertex.w);

        @(if $arg2 [result [
            vec4 mquat = vec4(cross(dqreal.xyz, vtangent.xyz) + dqreal.xyz*vtangent.w + vtangent.xyz*dqreal.w, dqreal.w*vtangent.w - dot(dqreal.xyz, vtangent.xyz));
            @(qtangentdecode $arg3)
        ]] [if (>= $numargs 2) [result [
            vec3 mnormal = cross(dqreal.xyz, cross(dqreal.xyz, vnormal) + vnormal*dqreal.w)*2.0 + vnormal;
        ]]])
    ]
]

// model shadowmapping

shadowmapcastervertexshader = [
    result [
        @(if (>= $numargs 2) [result $arg1])
        attribute vec4 vvertex;
        uniform mat4 modelmatrix;
        uniform vec4 shadowintensity;
        varying vec4 shadowmapvals;
        void main(void)
        {
            @(if (>= $numargs 2) [result $arg2] [result [
                #define mpos vvertex
            ]])
            gl_Position = modelmatrix * mpos;
            shadowmapvals = vec4(1.0 - gl_Position.z, 1.0, 0.0, shadowintensity.x);
        }
    ]
]

shader 0 shadowmapcaster (shadowmapcastervertexshader) [
    varying vec4 shadowmapvals;
    void main(void)
    {
        gl_FragColor = shadowmapvals;
    }
]
loop i 4 [
    variantshader 0 shadowmapcaster 0 (shadowmapcastervertexshader (skelanimdefs (+ $i 1)) (skelanim (+ $i 1))) []
]

shader 0 "shadowmapreceiver" [
    attribute vec4 vvertex;
    uniform mat4 shadowmatrix;
    uniform vec2 shadowmapbias;
    varying vec4 shadowmapvals;
    void main(void)
    {
        gl_Position = shadowmatrix * vvertex;
        shadowmapvals = vec4(0.0, 0.0, shadowmapbias.y - gl_Position.z, 0.0); 
    }
] [
    varying vec4 shadowmapvals;
    void main(void)
    {
        gl_FragColor = shadowmapvals;
    }
]

// model stenciling

notexturemodelvertexshader = [
    result [
        attribute vec4 vvertex, vcolor;
        uniform mat4 modelmatrix;
        varying vec4 color;
        @(if (>= $numargs 2) [result $arg1])
        //:fog
        void main(void)
        {
            @(if (>= $numargs 2) [result $arg2] [result [
                #define mpos vvertex
            ]])
            gl_Position = modelmatrix * mpos;
            color = vcolor;
        }
    ]
]

shader 0 notexturemodel (notexturemodelvertexshader) [
    varying vec4 color;
    void main(void)
    {
        gl_FragColor = color;
    }
]
loop i 4 [
    variantshader 0 notexturemodel 0 (notexturemodelvertexshader (skelanimdefs (+ $i 1)) (skelanim (+ $i 1))) []
]

// mdltype:
//    e -> envmap
//    n -> normalmap
//    s -> spec
//    m -> masks
//    b -> dual-quat skeletal animation
//    a -> alpha-tested
//    q -> qtangents
//    i -> glare intensity

mdlopt = [ >= (strstr $modeltype $arg1) 0 ]

modelvertexshader = [
    modeltype = $arg1
    result [
        @(if (mdlopt "b") [skelanimdefs $arg2 (mdlopt "q") (mdlopt "n")])
        //:fog
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        @(if (mdlopt "q") [result [
            attribute vec4 vtangent;
        ]] [result [
            attribute vec3 vnormal;
        ]])
        uniform mat4 modelmatrix; 
        uniform vec3 modelcamera, lightdir, lightscale;
        uniform vec2 texscroll;
        varying vec2 texcoord0;
        varying vec4 color;
        @(if (mdlopt "n") [result [
            @(if (mdlopt "e") [result [
                uniform mat3 modelworld;
                varying vec3 camvec;
                varying mat3 world;
            ]] [result [
                varying vec3 lightvec, halfangle;
            ]])
        ]] [result [
            @(if (mdlopt "s") [result [
                varying vec3 nvec, halfangle;
            ]])
            @(if (mdlopt "e") [result [
                uniform mat3 modelworld;
                uniform vec2 envmapscale;
                varying vec3 rvec;
                varying float rmod;
            ]])
        ]])
        void main(void)
        {
            @(if (mdlopt "b") [result [
                @(skelanim $arg2 (mdlopt "q") (mdlopt "n"))
            ]] [result [
                #define mpos vvertex
                @(if (mdlopt "q") [result [
                    #define mquat vtangent 
                    @(qtangentdecode (mdlopt "n"))
                ]] [result [
                    #define mnormal vnormal
                ]])
            ]])

            gl_Position = modelmatrix * mpos;

            @(if (|| (mdlopt "n") (mdlopt "s") (mdlopt "i")) [result [
                color = vcolor;
            ]])
            texcoord0 = vtexcoord0 + texscroll;
      
            @(if (|| (mdlopt "e") (mdlopt "s")) [result [
                vec3 camdir = normalize(modelcamera - mpos.xyz);
            ]])

            @(if (mdlopt "n") [
                if (mdlopt "e") [result [
                    camvec = modelworld * camdir;
                    // composition of tangent -> object and object -> world transforms
                    //   becomes tangent -> world
                    vec3 wnormal = modelworld * mnormal;
                    vec3 wtangent = modelworld * mtangent;
                    vec3 wbitangent = cross(wnormal, wtangent) * (vtangent.w < 0.0 ? -1.0 : 1.0);
                    world = mat3(wtangent, wbitangent, wnormal);
                ]] [result [
                    vec3 mbitangent = cross(mnormal, mtangent) * (vtangent.w < 0.0 ? -1.0 : 1.0);
                    lightvec = vec3(dot(lightdir, mtangent), dot(lightdir, mbitangent), dot(lightdir, mnormal));
                    @(if (mdlopt "s") [result [
                        vec3 halfdir = lightdir + camdir; 
                        halfangle = vec3(dot(halfdir, mtangent), dot(halfdir, mbitangent), dot(halfdir, mnormal));
                    ]])
                ]]
            ] [result [
                @(if (mdlopt "s") [result [
                    nvec = mnormal; 
                    halfangle = lightdir + camdir;
                ]] [if (! (mdlopt "i")) [result [
                    float intensity = dot(mnormal, lightdir);
                    color = vec4(vcolor.rgb*clamp(intensity*(intensity*lightscale.x + lightscale.y) + lightscale.z, 0.0, 1.0), vcolor.a);
                ]]])
                @(if (mdlopt "e") [result [
                    float invfresnel = dot(camdir, mnormal);
                    rvec = modelworld * (2.0*invfresnel*mnormal - camdir);
                    rmod = envmapscale.x*max(invfresnel, 0.0) + envmapscale.y;    
                ]])
            ]])
        }
    ] 
]

modelfragmentshader = [
    modeltype = $arg1
    result [
        varying vec2 texcoord0;
        varying vec4 color;
        @(if (mdlopt "n") [result [
            @(if (mdlopt "e") [result [
                #define lightvec lightdirworld
                uniform vec3 lightdirworld;
                uniform vec2 envmapscale;
                varying vec3 camvec;
                varying mat3 world;
            ]] [result [
                varying vec3 lightvec, halfangle;
            ]])
        ]] [result [
            @(if (mdlopt "s") [result [
                #define lightvec lightdir
                uniform vec3 lightdir;
                varying vec3 nvec, halfangle;
            ]])
            @(if (mdlopt "e") [result [
                varying vec3 rvec;
                varying float rmod;
            ]])
        ]])
        @(if (&& (|| (mdlopt "s") (mdlopt "n")) (! (mdlopt "i"))) [result [uniform vec3 lightscale;]])
        @(if (|| (mdlopt "s") (mdlopt "m")) [result [uniform vec4 maskscale;]])
        uniform sampler2D tex0;
        @(if (mdlopt "m") [result [uniform sampler2D tex1;]])
        @(if (mdlopt "e") [result [uniform samplerCube tex2;]])
        @(if (mdlopt "n") [result [uniform sampler2D tex3;]])
        @(? (mdlopt "a") [uniform float alphatest;])
        uniform float hwrthdrlin;
        uniform float hdrlightfix;
        uniform float hdrmatcol; uniform vec4 hdrjour; uniform float hdrjourt[24];
        uniform float hdrmdlsdr;
        void main(void)
        {
            // Integration HDR lot 1: players and CTF flags (hdrmdlsdr) are shaded as on
            // an SDR screen, then clipped at white and decoded once at the end. Their
            // fullbright plate / lamp-lit base must not go through the lot 5 light response.
            float hdrmdllin = (hwrthdrlin > 0.5 && hdrmdlsdr < 0.5) ? 1.0 : 0.0;
#define hwrthdrlin hdrmdllin
            vec4 light = texture2D(tex0, texcoord0);
            vec4 lcolor = color;
            @(hdrlightchroma "lcolor.rgb")
            @(if (mdlopt "m") [result [
                vec3 hdrEncoded = light.rgb;
            ]])

            @(? (mdlopt "a") [
                if(light.a <= alphatest)
                    discard;
            ])

            if(hwrthdrlin > 0.5) light.rgb = @(srgb2lin "light.rgb");
            light.rgb *= 2.0;

            @(if (mdlopt "m") [result [
                vec3 masks = texture2D(tex1, texcoord0).rgb;
                vec3 glow = light.rgb * maskscale.y;
                // Every masked skin (mdlopt m), not one model: magic seals, gems, torches.
                // Glow is the green mask times a display-referred scale, not a second albedo
                // and not a test on pixel brightness. maskscale.y is 0.5*mdlglow (default glow 3).
                // Historical mix was encoded*2*glowscale, then the 8-bit buffer clamped it.
                // Decoding the skin first left the seal too dim. One EOTF of that display
                // colour, plus the former overbright kept above 1. No blur halo.
                if(hwrthdrlin > 0.5)
                {
                    vec3 glowDisplay = hdrEncoded * (2.0 * maskscale.y);
                    vec3 glowBase = clamp(glowDisplay, 0.0, 1.0);
                    glow = @(srgb2lin "glowBase") + max(glowDisplay - vec3(1.0), vec3(0.0));
                }
            ]])
            @(hdrmatcouleur "light.rgb" "lcolor.rgb" "1.0") @(hdrjourmat "light.rgb" "lcolor.rgb" "1.0")

            @(if (mdlopt "n") [result [
                vec3 normal = texture2D(tex3, texcoord0).rgb - 0.5;
                @(if (mdlopt "e") [result [
                    normal = world * normal;
                ]])
                normal = normalize(normal);
            ]])

            @(if (mdlopt "s") [result [
                @(if (mdlopt "n") [
                    if (mdlopt "e") [result [
                        vec3 halfangle = lightvec + camvec;
                    ]]
                ] [result [
                    vec3 normal = normalize(nvec);
                ]])
                float spec = maskscale.x * pow(clamp(dot(normalize(halfangle), normal), 0.0, 1.0), @(? (mdlopt "i") "256.0" "128.0"));
                @(if (mdlopt "m") [result [spec *= masks.r;]])   // specmap in red channel
            ]])

            @(if (mdlopt "i") [
                if (mdlopt "s") [result [
                    spec *= maskscale.z;
                    @(? (mdlopt "m") "light.rgb" "gl_FragColor.rgb") = spec * lcolor.rgb;
                ]] [
                    if (! (mdlopt "m")) [result [gl_FragColor.rgb = vec3(0.0);]]
                ]
            ] [result [
                @(if (|| (mdlopt "s") (mdlopt "n")) [result [
                    float intensity = dot(normal, lightvec);
                    light.rgb *= clamp(intensity*(intensity*lightscale.x + lightscale.y) + lightscale.z, 0.0, 1.0);
                ]])
                @(if (mdlopt "s") [result [
                    light.rgb += spec;
                ]])
                @(if (|| (mdlopt "m") (mdlopt "e")) [result [
                    light.rgb *= lcolor.rgb;
                ]] [result [
                    gl_FragColor = light * lcolor;
                ]])
            ]])

            @(if (mdlopt "e") [result [
                @(if (mdlopt "n") [result [
                    vec3 camn = normalize(camvec);
                    float invfresnel = dot(camn, normal);
                    vec3 rvec = 2.0*invfresnel*normal - camn;
                    float rmod = envmapscale.x*max(invfresnel, 0.0) + envmapscale.y;
                ]])
                vec3 reflect = textureCube(tex2, rvec).rgb;
                if(hwrthdrlin > 0.5) reflect = @(srgb2lin "reflect");
                @(if (! (mdlopt "m")) [result [
                    gl_FragColor.rgb = mix(light.rgb, reflect, rmod);
                ]])
            ]])

            @(if (mdlopt "m") [result [
                @(if (mdlopt "e") [result [
                    light.rgb = mix(light.rgb, glow, masks.g); // glow mask in green channel
                    gl_FragColor.rgb = mix(light.rgb, reflect, rmod*masks.b); // envmap mask in blue channel
                ]] [if (mdlopt "i") [result [
                    float k = min(masks.g*masks.g*maskscale.w, 1.0); // glow mask in green channel
                    gl_FragColor.rgb = @(? (mdlopt "s") "glow*k + light.rgb" "glow*k");
                ]] [result [
                    gl_FragColor.rgb = mix(light.rgb, glow, masks.g); // glow mask in green channel
                ]]])
            ]])

            @(if (|| (mdlopt "i") (mdlopt "m") (mdlopt "e")) [result [
                gl_FragColor.a = light.a * color.a;
            ]])
#undef hwrthdrlin
            if(hwrthdrlin > 0.5 && hdrmdlsdr > 0.5)
            {
                vec3 hdrmdle = clamp(gl_FragColor.rgb, 0.0, 1.0);
                gl_FragColor.rgb = mix(hdrmdle / 12.92, pow((hdrmdle + 0.055) / 1.055, vec3(2.4)), step(vec3(0.04045), hdrmdle));
            }
        }
    ]
]

modelshader = [
    local shadername
    shadername = (concatword model $arg1)
    if (! (isshaderdefined $shadername)) [
        shader 0 $shadername (modelvertexshader $arg1) (modelfragmentshader $arg1)
        loop i 4 [
            variantshader 0 $shadername 0 (modelvertexshader (concatword $arg1 "b") (+ $i 1)) []
        ]
        glaremodeltype = (strreplace (concatword $arg1 "i") "e")
        if (< (strstr $glaremodeltype "s") 0) [glaremodeltype = (strreplace $glaremodeltype "n")]
        variantshader 0 $shadername 1 (modelvertexshader $glaremodeltype) (modelfragmentshader $glaremodeltype)
        loop i 4 [
            variantshader 0 $shadername 1 (modelvertexshader (concatword $glaremodeltype "b") (+ $i 1)) 1
        ]
        if (>= (strstr $arg1 "e") 0) [
            altshader $shadername (modelshader (strreplace $arg1 "e"))
        ]
        if (>= (strstr $arg1 "s") 0) [
            fastshader $shadername (modelshader (strreplace $arg1 "s")) 1
        ]
    ]
    result $shadername
]

////////////////////////////////////////////////
//
// separable blur with up to 7 taps
//
////////////////////////////////////////////////

blurshader = [
    shader 0 $arg1 [
        attribute vec4 vvertex;
        @(screentexcoord 0)
        uniform float offsets[8];
        varying vec2 texcoord0, texcoordp1, texcoordn1;
        @(loopconcat i (min (- $arg2 1) 2) [result [
            varying vec2 texcoordp@(+ $i 2), texcoordn@(+ $i 2);
        ]])
        void main(void)
        {
            gl_Position = vvertex;
            texcoord0 = vtexcoord0;
            vec2 tcp = vtexcoord0, tcn = vtexcoord0;
            tcp.@arg3 += offsets[1];
            tcn.@arg3 -= offsets[1];
            texcoordp1 = tcp;
            texcoordn1 = tcn;
            @(loopconcat i (min (- $arg2 1) 2) [result [
                tcp.@arg3 = vtexcoord0.@arg3 + offsets[@@(+ $i 2)];
                tcn.@arg3 = vtexcoord0.@arg3 - offsets[@@(+ $i 2)];
                texcoordp@(+ $i 2) = tcp;
                texcoordn@(+ $i 2) = tcn;
            ]])
        } 
    ] [
        uniform float weights[8];
        uniform float offsets[8];
        varying vec2 texcoord0, texcoordp1, texcoordn1;
        @(loopconcat i (min (- $arg2 1) 2) [result [
            varying vec2 texcoordp@(+ $i 2), texcoordn@(+ $i 2);
        ]])
        uniform sampler2D tex0;
        void main(void)
        {
            #define texval(coords) texture2D(tex0, (coords))
            vec4 val = texval(texcoord0) * weights[0];
            @(loopconcat i $arg2 [
                if (< $i 3) [result [
                    val += weights[@@(+ $i 1)] * (texval(texcoordp@(+ $i 1)) + texval(texcoordn@(+ $i 1)));
                ]] [result [
                    val += weights[@@(+ $i 1)] *
                    @(if (=s $arg3 "x") [result [
                        (texval(vec2(texcoord0.x + offsets[@@(+ $i 1)], texcoord0.y)) +
                         texval(vec2(texcoord0.x - offsets[@@(+ $i 1)], texcoord0.y)));
                    ]] [result [
                        (texval(vec2(texcoord0.x, texcoord0.y + offsets[@@(+ $i 1)])) +
                         texval(vec2(texcoord0.x, texcoord0.y - offsets[@@(+ $i 1)])));
                    ]])
                ]]
            ])
            gl_FragColor = val;
        }
    ]
]

loop i 7 [
    blurshader (format "blurx%1" (+ $i 1)) (+ $i 1) x
    blurshader (format "blury%1" (+ $i 1)) (+ $i 1) y
    if (> $i 0) [
        altshader (format "blurx%1" (+ $i 1)) (format "blurx%1" $i)
        altshader (format "blury%1" (+ $i 1)) (format "blury%1" $i)
    ]
]

////////////////////////////////////////////////
//
// full screen shaders: 
//
////////////////////////////////////////////////

fsvs = [result [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    uniform vec2 postfxscale;
    varying vec2 texcoord0;
    @arg2
    void main(void)
    {
        gl_Position = vvertex;   // woohoo, no mvp :) 
        texcoord0 = vtexcoord0;
        @arg1
    }
]]

fsps = [result [
    uniform sampler2D tex0; 
    varying vec2 texcoord0;
    @arg2
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        @arg1
    }
]]

fsvs4 = [
    fsvs [
        texcoord1 = vtexcoord0 + vec2(-1.5, -1.5)*postfxscale;
        texcoord2 = vtexcoord0 + vec2( 1.5, -1.5)*postfxscale;
        texcoord3 = vtexcoord0 + vec2(-1.5,  1.5)*postfxscale;
        texcoord4 = vtexcoord0 + vec2( 1.5,  1.5)*postfxscale;
        @arg1
    ] [
        varying vec2 texcoord1, texcoord2, texcoord3, texcoord4;
    ]
]

fsps4 = [
    fsps [
        vec4 s00 = texture2D(tex0, texcoord1);
        vec4 s02 = texture2D(tex0, texcoord2);
        vec4 s20 = texture2D(tex0, texcoord3);
        vec4 s22 = texture2D(tex0, texcoord4);
        @arg1
    ] [
        varying vec2 texcoord1, texcoord2, texcoord3, texcoord4;
    ]
]

// some simple ones that just do an effect on the RGB value...

lazyshader 0 "invert" (fsvs) (fsps [gl_FragColor = 1.0 - color;])
lazyshader 0 "gbr"    (fsvs) (fsps [gl_FragColor = color.yzxw;])
lazyshader 0 "bw"     (fsvs) (fsps [gl_FragColor = vec4(dot(color.xyz, vec3(0.333)));])

// HDR interne (post-process): exposure + Reinhard, then a little black crush.
// Black stays black (no mix-to-white). Bloom = glare. HUD/chat after postfx.
// params.x = exposure, params.y = saturation, params.z = Reinhard, params.w = shadow crush.
lazyshader 0 "hdrtonemap" (fsvs) (fsps [
    vec3 c = max(color.rgb, vec3(0.0));
    float e = params.x;
    float k = params.z;
    vec3 x = c * e;
    x = x / (vec3(1.0) + x * k);
    float w = e / (1.0 + e * k);
    c = x / max(w, 0.001);
    float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float shadow = 1.0 - smoothstep(0.02, 0.62, lum);
    c = mix(c * c, c, 1.0 - params.w * shadow);
    lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
    float hi = smoothstep(0.30, 0.72, lum);
    c = c * (1.0 + 0.22 * hi);
    float grey = dot(c, vec3(0.2126, 0.7152, 0.0722));
    c = mix(vec3(grey), c, params.y);
    gl_FragColor = vec4(clamp(c, 0.0, 1.0), color.a);
] [uniform vec4 params;])

// SSAO: color tex0 + depth tex1. No ] in this body (CubeScript).
// Large depth jumps (player vs wall) must not count, or models get a black outline.
lazyshader 0 "lookssao" (fsvs) (fsps [
    float n = lookaoproj.x;
    float f = lookaoproj.y;
    float z0 = texture2D(tex1, texcoord0).r;
    float ndc0 = z0 * 2.0 - 1.0;
    float d0 = (2.0 * n * f) / (f + n - ndc0 * (f - n));
    float px = lookaoproj.z * 7.0 * lookaoparams.y;
    float py = lookaoproj.w * 7.0 * lookaoparams.y;
    float range = d0 * 0.06 + 0.18;
    float maxgap = d0 * 0.12 + 0.50;
    float ao = 0.0;
    float z = texture2D(tex1, texcoord0 + vec2(px, 0.0)).r;
    float ndc = z * 2.0 - 1.0;
    float d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    float zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(-px, 0.0)).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(0.0, py)).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(0.0, -py)).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(px, py) * 0.75).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(-px, py) * 0.75).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(px, -py) * 0.75).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    z = texture2D(tex1, texcoord0 + vec2(-px, -py) * 0.75).r;
    ndc = z * 2.0 - 1.0;
    d1 = (2.0 * n * f) / (f + n - ndc * (f - n));
    zd = d0 - d1;
    ao = ao + clamp(zd / range, 0.0, 1.0) * (1.0 - clamp(zd / maxgap, 0.0, 1.0));
    ao = ao * 0.125 * (1.0 - step(0.999, z0));
    gl_FragColor = vec4(color.rgb * (1.0 - lookaoparams.x * ao), color.a);
] [uniform sampler2D tex1; uniform vec4 lookaoproj; uniform vec4 lookaoparams;])

// Temporal AA for the composited frame (RT grain + raster edges).
// No ] or @ in this body (CubeScript). History is the previous resolved
// colour; motion comes from unprojecting window depth with this frame's
// camproj and reprojecting with last frame's. Players ghost, so history
// is clamped to the current 3x3 neighbourhood.
lazyshader 0 "looktaa" (fsvs) (fsps [
    vec3 cur = color.rgb;
    if(looktaaparams.x < 0.5)
    {
        gl_FragColor = color;
        return;
    }
    vec2 px = vec2(looktaaproj.z, looktaaproj.w);
    float z = texture2D(tex1, texcoord0).r;
    z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x, -px.y)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2( 0.0,  -px.y)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,  -px.y)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x,   0.0)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,   0.0)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x,   px.y)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2( 0.0,    px.y)).r);
    z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,   px.y)).r);
    if(z > 0.9995)
    {
        gl_FragColor = color;
        return;
    }
    float ndc0 = z * 2.0 - 1.0;
    vec4 clip = vec4(texcoord0.x * 2.0 - 1.0, texcoord0.y * 2.0 - 1.0, ndc0, 1.0);
    vec4 worldh = invcamproj * clip;
    vec3 world = worldh.xyz / max(worldh.w, 0.000001);
    vec4 prevh = prevcamproj * vec4(world, 1.0);
    float pw = max(prevh.w, 0.000001);
    vec2 prevuv = prevh.xy / pw;
    prevuv = prevuv * 0.5 + 0.5;
    if(prevh.w <= 0.0 || prevuv.x < 0.0 || prevuv.x > 1.0 || prevuv.y < 0.0 || prevuv.y > 1.0)
    {
        gl_FragColor = color;
        return;
    }
    vec3 cmin = cur;
    vec3 cmax = cur;
    vec3 s;
    s = texture2D(tex0, texcoord0 + vec2(-px.x, -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2( 0.0,  -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2( px.x,  -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2(-px.x,   0.0)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2( px.x,   0.0)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2(-px.x,   px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2( 0.0,    px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    s = texture2D(tex0, texcoord0 + vec2( px.x,   px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
    vec3 hist = clamp(texture2D(tex2, prevuv).rgb, cmin, cmax);
    float vel = length((prevuv - texcoord0) / max(px, vec2(0.000001)));
    float contrast = length(cmax - cmin);
    float edge = clamp(contrast * 3.0, 0.0, 1.0);
    float curw = mix(0.28, 0.10, edge);
    float farf = clamp((z - 0.92) / 0.07, 0.0, 1.0);
    curw = mix(curw, max(curw, 0.40), farf * (1.0 - edge));
    curw = mix(curw, min(curw + 0.12, 0.45), clamp(vel * 0.08, 0.0, 1.0));
    if(vel > 48.0) curw = 1.0;
    gl_FragColor = vec4(mix(hist, cur, curw), color.a);
] [uniform sampler2D tex1, tex2; uniform mat4 invcamproj; uniform mat4 prevcamproj; uniform vec4 looktaaproj; uniform vec4 looktaaparams;])

// Dedicated static-scenery velocity (see data/hwrt.cfg). Last write wins after
// resetgl, so this copy must stay identical to the hwrt.cfg original.
shader 0 "hwrtvelocity" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform mat4 invcamproj;
    uniform mat4 currunjitproj;
    uniform mat4 prevunjitproj;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        float z = texture2D(tex0, texcoord0).r;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5)
        {
            float ndc0 = z * 2.0 - 1.0;
            vec4 clip = vec4(texcoord0.x * 2.0 - 1.0, texcoord0.y * 2.0 - 1.0, ndc0, 1.0);
            vec4 worldh = invcamproj * clip;
            vec3 world = worldh.xyz / max(worldh.w, 0.000001);
            vec4 prevh = prevunjitproj * vec4(world, 1.0);
            vec2 curruv = texcoord0;
            if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001)
            {
                vec4 currh = currunjitproj * vec4(world, 1.0);
                if(currh.w > 0.0) curruv = (currh.xy / currh.w) * 0.5 + 0.5;
            }
            if(prevh.w > 0.0)
            {
                vec2 prevuv = (prevh.xy / prevh.w) * 0.5 + 0.5;
                motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
            }
        }
        gl_FragColor = vec4(motion, 1.0, 0.0);
    }
]

shader 0 "hwrtveldebug" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0, tex1, tex2;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 vel = texture2D(tex0, texcoord0);
        vec3 cur = texture2D(tex1, texcoord0).rgb;
        float valid = vel.z;
        vec2 motion = vel.xy;
        vec2 px = vec2(velparams.x, velparams.y);
        vec2 jdelta = vec2(veljitter.z - veljitter.x, veljitter.w - veljitter.y);
        vec2 prevuv = texcoord0 + motion * px + jdelta * px;
        float mode = velparams.z;
        vec3 outc = cur;
        if(valid < 0.5)
        {
            outc = vec3(0.72, 0.0, 0.68);
        }
        else if(mode < 1.5)
        {
            float s = velparams.w;
            outc = vec3(motion.x * s + 0.5, motion.y * s + 0.5, 0.12);
        }
        else if(prevuv.x < 0.0 || prevuv.x > 1.0 || prevuv.y < 0.0 || prevuv.y > 1.0)
        {
            outc = vec3(0.05, 0.18, 0.28);
        }
        else
        {
            vec3 hist = texture2D(tex2, prevuv).rgb;
            if(mode < 2.5) outc = hist;
            else
            {
                vec3 d = abs(cur - hist);
                float e = (d.x + d.y + d.z) * 4.0;
                outc = vec3(e, 1.0 - clamp(e, 0.0, 1.0), 0.0);
            }
        }
        gl_FragColor = vec4(outc, 1.0);
    }
]

shader 0 "hwrtvelobject" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform mat4 prevmodelmatrix;
    uniform mat4 currunjitmatrix;
    uniform vec2 texscroll;
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        prevclip = prevmodelmatrix * vvertex;
        currclip = currunjitmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        vec2 curruv = gl_FragCoord.xy * vec2(velparams.x, velparams.y);
        if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001 && currclip.w > 0.0)
            curruv = (currclip.xy / currclip.w) * 0.5 + 0.5;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5 && prevclip.w > 0.0)
        {
            vec2 prevuv = (prevclip.xy / prevclip.w) * 0.5 + 0.5;
            motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
        }
        gl_FragColor = vec4(motion, 1.0, 0.0);
    }
]

shader 0 "hwrtvelskel" [
    attribute vec4 vvertex;
    attribute vec3 vnormal;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform mat4 prevmodelmatrix;
    uniform mat4 currunjitmatrix;
    uniform vec2 texscroll;
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        prevclip = prevmodelmatrix * vec4(vnormal, 1.0);
        currclip = currunjitmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        vec2 curruv = gl_FragCoord.xy * vec2(velparams.x, velparams.y);
        if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001 && currclip.w > 0.0)
            curruv = (currclip.xy / currclip.w) * 0.5 + 0.5;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5 && prevclip.w > 0.0)
        {
            vec2 prevuv = (prevclip.xy / prevclip.w) * 0.5 + 0.5;
            motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
        }
        gl_FragColor = vec4(motion, 1.0, 1.0);
    }
]

shader 0 "hwrtvelunlit" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform vec2 texscroll;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        gl_FragColor = vec4(skin.rgb, 1.0);
    }
]

shader 0 "hwrtvelid" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    attribute vec4 vcolor;
    uniform mat4 modelmatrix;
    uniform vec2 texscroll;
    varying vec2 texcoord0;
    varying vec4 id;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
        id = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 id;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        gl_FragColor = vec4(id.rgb, gl_FragCoord.z);
    }
]

// Edge AA, directional. No ] in this body (CubeScript).
//
// The four diagonal neighbours give a luma gradient; the edge runs
// perpendicular to it, so sampling ALONG that perpendicular averages the
// pixels the edge passes through and estimates how much of this pixel it
// really covers. That is the whole trick, and it is why this looks straight
// where a symmetric blur only looks soft: a blur across the edge cannot
// recover coverage, it just spreads the staircase over more pixels.
//
// dir is derived rather than copied from Lottes' listing on purpose. His
// N/S naming assumes y grows downward; screentexcoord here grows upward, and
// taking the sign on faith rotates the sampling 90 degrees, which sharpens
// the staircase instead of removing it.
//
// The early out is FXAA 3.11's quality threshold: 0.0312 absolute, or 12.5%
// of the brightest neighbour, whichever is larger. It matters more here than
// in a rasteriser-only engine, because ray-traced speckle is exactly the
// low-contrast high-frequency signal an edge filter mistakes for an edge and
// smears into blotches. Grain below the threshold is left alone.
lazyshader 0 "fxaa" (fsvs) (fsps [
    vec2 px = postfxscale;
    vec3 luma = vec3(0.299, 0.587, 0.114);
    float lm = dot(color.rgb, luma);
    float lmm = dot(texture2D(tex0, texcoord0 + vec2(-px.x, -px.y)).rgb, luma);
    float lpm = dot(texture2D(tex0, texcoord0 + vec2( px.x, -px.y)).rgb, luma);
    float lmp = dot(texture2D(tex0, texcoord0 + vec2(-px.x,  px.y)).rgb, luma);
    float lpp = dot(texture2D(tex0, texcoord0 + vec2( px.x,  px.y)).rgb, luma);

    float lmin = min(lm, min(min(lmm, lpm), min(lmp, lpp)));
    float lmax = max(lm, max(max(lmm, lpm), max(lmp, lpp)));

    if(lmax - lmin < max(0.0312, lmax * 0.125))
    {
        gl_FragColor = color;
        return;
    }

    // Luma gradient, then the perpendicular to it.
    float gx = (lpm + lpp) - (lmm + lmp);
    float gy = (lmp + lpp) - (lmm + lpm);
    vec2 dir = vec2(-gy, gx);

    // Scale so the shorter component spans about one pixel, capped at 8. The
    // reduce term keeps a near-axis-aligned edge, where one component is
    // almost zero, from blowing the span up to the cap on rounding noise.
    float reduce = max((lmm + lpm + lmp + lpp) * 0.0078125, 0.0078125);
    dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + reduce), vec2(-8.0), vec2(8.0)) * px;

    vec3 inner = 0.5 * (texture2D(tex0, texcoord0 + dir * -0.1666667).rgb +
                        texture2D(tex0, texcoord0 + dir *  0.1666667).rgb);
    vec3 outer = inner * 0.5 + 0.25 * (texture2D(tex0, texcoord0 + dir * -0.5).rgb +
                                       texture2D(tex0, texcoord0 + dir *  0.5).rgb);

    // The wide pair reaches past the edge on a corner or a thin leaf. If its
    // luma left the neighbourhood, it sampled something unrelated, so fall
    // back to the narrow pair rather than drag a foreign colour in.
    float lo = dot(outer, luma);
    gl_FragColor = vec4((lo < lmin || lo > lmax) ? inner : outer, color.a);
] [uniform vec2 postfxscale;])

// sobel

lazyshader 0 "sobel" (fsvs4) (fsps4 [
    vec4 t = s00 + s20 - s02 - s22;
    vec4 u = s00 + s02 - s20 - s22;
    gl_FragColor = color + t*t + u*u;
])

// rotoscope

lazyshader 0 "rotoscope" [
    attribute vec4 vvertex;
    @(screentexcoord 0)
    uniform vec2 postfxscale;
    uniform vec4 params;
    varying vec2 t11, t00, t12, t01, t20, t02, t21, t10, t22;
    void main(void)
    {
        gl_Position = vvertex;
        t11 = vtexcoord0;
        vec2 scale = postfxscale*params.x;
        t00 = vec2(-1.0, -1.0)*scale + vtexcoord0;
        t12 = vec2( 0.0,  1.0)*scale + vtexcoord0;
        t01 = vec2(-1.0,  0.0)*scale + vtexcoord0;
        t20 = vec2( 1.0, -1.0)*scale + vtexcoord0;
        t02 = vec2(-1.0,  1.0)*scale + vtexcoord0;
        t21 = vec2( 1.0,  0.0)*scale + vtexcoord0;
        t10 = vec2( 0.0, -1.0)*scale + vtexcoord0;
        t22 = vec2( 1.0,  1.0)*scale + vtexcoord0;
    }
] [
    uniform sampler2D tex0; 
    varying vec2 t11, t00, t12, t01, t20, t02, t21, t10, t22;
    void main(void)
    {
        vec4 c00 = texture2D(tex0, t00);
        vec4 c01 = texture2D(tex0, t01);
        vec4 c02 = texture2D(tex0, t02);
        vec4 c10 = texture2D(tex0, t10);
        vec4 c11 = texture2D(tex0, t11);
        vec4 c12 = texture2D(tex0, t12);
        vec4 c20 = texture2D(tex0, t20);
        vec4 c21 = texture2D(tex0, t21);
        vec4 c22 = texture2D(tex0, t22);

        vec4 diag1 = c00 - c22;
        vec4 diag2 = c02 - c20;
        vec4 xedge = (c01 - c21)*2.0 + diag1 + diag2;
        vec4 yedge = (c10 - c12)*2.0 + diag1 - diag2;
        xedge *= xedge;
        yedge *= yedge;

        vec4 xyedge = xedge + yedge;
        float sobel = step(max(xyedge.x, max(xyedge.y, xyedge.z)), 0.1);

        float hue = dot(c11.xyz, vec3(1.0));
        c11 /= hue;
        vec3 cc = step(vec3(0.2, 0.8, 1.5), vec3(hue));
        c11 *= dot(cc, vec3(0.5, 0.5, 1.5)); 

        gl_FragColor = c11 * max(cc.z, sobel);
    }
]

blur3shader = [
    lazyshader 0 $arg1 [ 
        attribute vec4 vvertex;
        @(screentexcoord 0)
        uniform vec2 postfxscale;
        varying vec2 texcoord0, texcoord1;
        void main(void)
        {
            gl_Position = vvertex;
            texcoord0 = vtexcoord0 + vec2(@(if $arg2 -0.5 0.0), @(if $arg3 -0.5 0.0))*postfxscale;
            texcoord1 = vtexcoord0 + vec2(@(if $arg2  0.5 0.0), @(if $arg3  0.5 0.0))*postfxscale;
        }
    ] [
        varying vec2 texcoord0, texcoord1;
        uniform sampler2D tex0; 
        void main(void)
        {
            gl_FragColor = 0.5*(texture2D(tex0, texcoord0) + texture2D(tex0, texcoord1));
        }
    ]
]
blur3shader hblur3 1 0
blur3shader vblur3 0 1

blur5shader = [
    lazyshader 0 $arg1 [
        attribute vec4 vvertex;
        @(screentexcoord 0)
        uniform vec2 postfxscale;
        varying vec2 texcoord0, texcoord1, texcoord2;
        void main(void)
        {
            gl_Position = vvertex;
            texcoord0 = vtexcoord0;
            texcoord1 = vtexcoord0 + vec2(@(? $arg2 -1.333 0.0), @(? $arg3 -1.333 0.0))*postfxscale;
            texcoord2 = vtexcoord0 + vec2(@(? $arg2  1.333 0.0), @(? $arg3  1.333 0.0))*postfxscale;
        }
    ] [
        uniform sampler2D tex0; 
        varying vec2 texcoord0, texcoord1, texcoord2;
        void main(void)
        {
            gl_FragColor = 0.4*texture2D(tex0, texcoord0) + 0.3*(texture2D(tex0, texcoord1) + texture2D(tex0, texcoord2));
        } 
    ]
]
blur5shader hblur5 1 0
blur5shader vblur5 0 1

rotoscope = [
    clearpostfx
    if (>= $numargs 1) [addpostfx rotoscope 0 0 0 $arg1]
    if (>= $numargs 2) [
        if (= $arg2 1) [addpostfx hblur3; addpostfx vblur3]
        if (= $arg2 2) [addpostfx hblur5; addpostfx vblur5]
    ]
]

shader 0 "screenrect" [
    attribute vec4 vvertex, vcolor;
    @(screentexcoord 0)
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0;
    void main(void)
    {
        gl_FragColor = color * texture2D(tex0, texcoord0);
    }
]

// bloom-ish

lazyshader 0 "bloom_scale" (fsvs4) (fsps4 [
    gl_FragColor = 0.2 * (s02 + s00 + s22 + s20 + color);
])

lazyshader 0 "bloom_init" (fsvs) (fsps [
    float t = max(color.r, max(color.g, color.b));
    gl_FragColor = t*t*color;
])

bloomshader = [
  defershader 0 $arg1 [
    forceshader "bloom_scale"
    forceshader "bloom_init"
    shader 0 @arg1 [
        attribute vec4 vvertex;
        @(screentexcoord 0)
        varying vec2 texcoord0;
        void main(void)
        {
            gl_Position = vvertex;
            texcoord0 = vtexcoord0;
        }
    ] [
        uniform vec4 params;
        varying vec2 texcoord0;
        uniform sampler2D tex0 @@(loopconcat i $arg2 [result [, tex@(+ $i 1)]]); 
        void main(void)
        {
            vec4 sample = texture2D(tex0, texcoord0);
            @@(loopconcat i $arg2 [result [
                @(? $i "bloom +=" "vec4 bloom =") texture2D(tex@(+ $i 1), texcoord0);
            ]])
            gl_FragColor = bloom*params.x + sample;
        }
    ]
  ]
]

bloomshader bloom1 1
bloomshader bloom2 2
bloomshader bloom3 3
bloomshader bloom4 4
bloomshader bloom5 5
bloomshader bloom6 6

setupbloom = [
    addpostfx bloom_init 1 1 "+0"
    loop i (- $arg1 1) [
        addpostfx bloom_scale (+ $i 2) (+ $i 2) (concatword "+" (+ $i 1))
    ]
    addpostfx (concatword bloom $arg1) 0 0 (loopconcat i (+ $arg1 1) [result $i]) $arg2
]

bloom = [
    clearpostfx
    if (>= $numargs 1) [setupbloom 6 $arg1]
]

////////////////////////////////////////////////
//
// miscellaneous effect shaders: 
//
////////////////////////////////////////////////

// wobbles the vertices of an explosion sphere
// and generates all texcoords 
// and blends the edge color
// and modulates the texture
explosionshader = [
    shader 0 $arg1 [
        //:fog
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        uniform mat4 explosionmatrix;
        uniform vec3 center;
        uniform float millis;
        uniform vec3 texgenS, texgenT;
        varying vec4 color;
        varying vec2 texcoord0, texcoord1, texcoord2;
        @(if (>= (strstr $arg1 "soft") 0) [result [uniform vec4 depthfxparams; varying vec4 texcoord3; ]])
        void main(void)
        {
            vec4 wobble = vec4(vvertex.xyz*(1.0 + 0.5*abs(fract(dot(vvertex.xyz, center) + millis*2.0) - 0.5)), vvertex.w);
            @(if (>= (strstr $arg1 "soft") 0) [result [
                gl_Position = explosionmatrix * wobble;

                texcoord3 = vec4(0.5*(gl_Position.xy + gl_Position.w), gl_Position.w, depthfxparams.y + gl_Position.w*depthfxparams.x);
            ]] [result [
                gl_Position = explosionmatrix * wobble;
            ]])

            color = vcolor;
       
            texcoord0 = vtexcoord0;
            vec2 texgen = vec2(dot(texgenS, vvertex.xyz), dot(texgenT, vvertex.xyz));
            texcoord1 = texgen;
            texcoord2 = 0.5*texgen - millis*0.5;
        } 
    ] [ 
        @(if (>= (strstr $arg1 "soft") 0) [result [
            uniform sampler2D tex2;
        ]])
        uniform sampler2D tex0, tex1;
        uniform vec2 blendparams;
        uniform float hwrthdrlin;
        varying vec4 color;
        varying vec2 texcoord0, texcoord1, texcoord2;
        @(if (>= (strstr $arg1 "soft") 0) [result [uniform vec4 depthfxparams; varying vec4 texcoord3; ]]) 
        @(if (>= (strstr $arg1 "soft8") 0) [result [uniform vec4 depthfxselect;]])
        void main(void)
        {
            vec2 dtc = texcoord0 + texture2D(tex0, texcoord2).xy*0.1; // use color texture as noise to distort texcoords
            vec4 diffuse = texture2D(tex0, dtc);
            float blend = max(pow(clamp(1.0 - dot(texcoord1, texcoord1), 0.0, 1.0), blendparams.x), blendparams.y);
            @(if (>= (strstr $arg1 "glare") 0) [result [
                float k = blend*blend;
                diffuse.rgb *= k*8.0;
                diffuse.a *= k;
                diffuse.b += k*k;
            ]] [result [
                diffuse *= blend*4.0; // dup alpha into RGB channels + intensify and over saturate
                diffuse.b += 0.5 - blend*0.5; // blue tint 
            ]])

            @(if (>= (strstr $arg1 "soft") 0) [result [
                gl_FragColor.rgb = diffuse.rgb * color.rgb;
                if(hwrthdrlin > 0.5) gl_FragColor.rgb = @(srgb2lin "gl_FragColor.rgb");

                #define depthvals texture2DProj(tex2, texcoord3.xyz)
                @(if (>= (strstr $arg1 "soft8") 0) [result [
                    float depth = dot(depthvals, depthfxselect);
                ]] [result [
                    float depth = depthvals.x*depthfxparams.z;
                ]])
                gl_FragColor.a = diffuse.a * max(clamp(depth - texcoord3.w, 0.0, 1.0) * color.a, depthfxparams.w);
            ]] [result [
                gl_FragColor = diffuse * color;
                if(hwrthdrlin > 0.5) gl_FragColor.rgb = @(srgb2lin "gl_FragColor.rgb");
            ]])
        }
    ]
]

looplist i ["" "glare" "soft" "soft8"] [
    explosionshader [explosion@i]
]

shader 0 "explosionbias" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 explosionmatrix;
    uniform vec3 center;
    uniform float millis;
    uniform vec3 texgenS, texgenT;
    varying vec4 color;
    varying vec2 texcoord0, texcoord1, texcoord2;
    void main(void)
    {
        vec4 wobble = vec4(vvertex.xyz*(1.0 + 0.5*abs(fract(dot(vvertex.xyz, center) + millis*2.0) - 0.5)), vvertex.w);
        gl_Position = explosionmatrix * wobble;
        color = vcolor;
        texcoord0 = vtexcoord0;
        vec2 texgen = vec2(dot(texgenS, vvertex.xyz), dot(texgenT, vvertex.xyz));
        texcoord1 = texgen;
        texcoord2 = 0.5*texgen - millis*0.5;
    }
] [
    uniform sampler2D tex0;
    uniform vec2 blendparams;
    varying vec4 color;
    varying vec2 texcoord0, texcoord1, texcoord2;
    void main(void)
    {
        vec2 dtc = texcoord0 + texture2D(tex0, texcoord2).xy*0.1;
        vec4 diffuse = texture2D(tex0, dtc);
        float envelope = max(pow(clamp(1.0 - dot(texcoord1, texcoord1), 0.0, 1.0), blendparams.x), blendparams.y);
        diffuse *= envelope*4.0;
        vec4 vis = diffuse * color;
        float cover = clamp(max(max(vis.r, vis.g), vis.b) * vis.a, 0.0, 1.0);
        if(cover < 0.12) cover = 0.0;
        gl_FragColor = vec4(cover, cover, cover, 1.0);
    }
]

shader 0 "particlebias" [
    attribute vec4 vvertex, vcolor;
    attribute vec2 vtexcoord0;
    uniform mat4 camprojmatrix;
    uniform vec4 colorscale;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        texcoord0 = vtexcoord0;
        color = vcolor * colorscale;
    }
] [
    uniform sampler2D tex0;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        float a = texture2D(tex0, texcoord0).a * color.a;
        if(a < 0.12) a = 0.0;
        gl_FragColor = vec4(a, a, a, 1.0);
    }
]

shader 0 "particlenotexture" [
    //:fog
    attribute vec4 vvertex, vcolor;
    uniform mat4 camprojmatrix;
    uniform vec4 colorscale;
    varying vec4 color;
    void main(void)
    {
        gl_Position = camprojmatrix * vvertex;
        color = vcolor * colorscale;
    } 
] [
    uniform float hwrthdrlin;
    uniform vec4 particlemod;
    varying vec4 color;
    void main(void)
    {
        vec3 tint = color.rgb;
        // No texture on this path. The vertex color is one color, decoded once.
        if(hwrthdrlin > 0.5 && particlemod.x < 0.5) tint = @(srgb2lin "tint");
        gl_FragColor = vec4(tint, color.a);
    }
]

particleshader = [
    shader 0 $arg1 [
        //:fog
        attribute vec4 vvertex, vcolor;
        attribute vec2 vtexcoord0;
        uniform mat4 camprojmatrix;
        uniform vec4 colorscale;
        varying vec2 texcoord0;
        varying vec4 color;
        @(if (>= (strstr $arg1 "soft") 0) [result [uniform vec4 depthfxparams; varying vec3 texcoord1, surface; ]]) 
        void main(void)
        {
            gl_Position = camprojmatrix * vvertex;
            texcoord0 = vtexcoord0;
            color = vcolor * colorscale; 

            @(if (>= (strstr $arg1 "soft") 0) [result [
                texcoord1 = vec3(0.5*(gl_Position.xy + gl_Position.w), gl_Position.w);

                vec2 offset = vtexcoord0*2.82842712474619 - 1.4142135623731;
                surface = vec3(offset, depthfxparams.y + gl_Position.w*depthfxparams.x);
            ]])
        }
    ] [
        @(if (>= (strstr $arg1 "soft") 0) [result [
            uniform sampler2D tex2;
        ]])
        uniform sampler2D tex0;
        uniform float hwrthdrlin;
        uniform vec4 particlemod;
        varying vec2 texcoord0;
        varying vec4 color;
        @(if (>= (strstr $arg1 "soft") 0) [result [uniform vec4 depthfxparams; varying vec3 texcoord1, surface;]]) 
        @(if (>= (strstr $arg1 "soft8") 0) [result [uniform vec4 depthfxselect;]])
        void main(void)
        {
            vec4 diffuse = texture2D(tex0, texcoord0);

            @(if (>= (strstr $arg1 "soft") 0) [result [
                #define depthvals texture2DProj(tex2, texcoord1)
                @(if (>= (strstr $arg1 "soft8") 0) [result [
                    float depth = dot(depthvals, depthfxselect);
                ]] [result [
                    float depth = depthvals.x*depthfxparams.z;
                ]])
                diffuse.a *= clamp(depth - dot(surface.xy, surface.xy) - surface.z, 0.0, 1.0);
            ]])

            vec3 tex = diffuse.rgb;
            vec3 tint = color.rgb;
            vec3 authored = tex * tint;
            // particlemod is set by the renderer for the whole resource.
            // x > 0.5: multiplicative blend, factors stay stored (blood).
            // y > 0.5: texture is a mask. z > 0.5: tint is a gain.
            // Otherwise that factor is a color and is decoded once.
            // Two decoded colors are two signals. Alpha is never decoded.
            // Nothing here reads the brightness or the chroma of this pixel.
            if(hwrthdrlin > 0.5 && particlemod.x < 0.5)
            {
                vec3 texSig = tex;
                vec3 tintSig = tint;
                if(particlemod.y < 0.5) texSig = @(srgb2lin "tex");
                if(particlemod.z < 0.5) tintSig = @(srgb2lin "tint");
                authored = texSig * tintSig;
            }
            gl_FragColor = vec4(authored, diffuse.a * color.a);
        }
    ]     
]

looplist i ["" "soft" "soft8"] [
    particleshader [particle@i]
]

