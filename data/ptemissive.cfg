// Path tracing, logical lighting (PT 3 prototype): the "forgotten emissives" list.
// Light fittings the scenery shows without a glow map, for hwrtptlogiclum (lights.cpp ptlum.inc).
// A map lamp set against a fitting (within hwrtptlogiclumdist units) is that fitting's light; a fitting with no lamp
// lights only if a line below gives it a power.
//   ptemissivemodel PATTERN R G B POWER SIZE OFFZ  models whose name contains PATTERN (case-insensitive) are fittings;
//                                                  R G B 0-255, POWER (light x units^2 per unit of colour, 0: only
//                                                  through a map lamp), SIZE (units, 0: the model's own), OFFZ (height
//                                                  of the source above the model's box centre)
//   ptemissivetex PATTERN R G B POWER SIZE OFFZ    textures whose path contains PATTERN: fitting faces; POWER per
//                                                  unit^2 of face
//   ptemissivenot PATTERN                          never a fitting (model or texture)
// With hwrtpttexlights 1 (PT 5, pttex.inc) the light textures (these and the built-in names below, and every texture
// with a glow map) light from their own surface: for a ptemissivetex line, R G B (when not 0 0 0) is that light's colour
// and POWER (when above 0) multiplies its strength (1: as the other light textures).
// Texture patterns: no path separator (texture paths use the system's own); model names keep their "/".
// Built in (lights.cpp ptlum.inc): models named lamp, lantern, light, chandelier, candle, sconce, neon, bulb, lustre;
// textures named light, lamp, neon, fluo, bulb, lantern, lig0, lig1, lig2 (tech1soc lights); never torch_cold, lightning,
// flashlight, highlight, lightmap, skybox.

ptemissiveclear

// Stock packs: fittings the built-in names miss (found next to map lamps that had no visible source).
ptemissivetex "lig_0" 0 0 0 0 0 0               // egyptsoc lights (lig_032-01b1, lig_064-04y1...)
ptemissivetex "jflitestr" 0 0 0 0 0 0           // jf1 light strip
ptemissivetex "_lit1" 0 0 0 0 0 0               // ikbase lit trims (ik_gtrimh_lit1a, ik_gtrimv_lit1a)
ptemissivemodel "med_chand" 0 0 0 0 0 0         // medieval chandelier
ptemissivemodel "gem_cap" 0 0 0 0 0 0           // glowing gems on caps
ptemissivemodel "simonoc/effect" 0 0 0 0 0 0    // glow effect models
ptemissivemodel "vending" 0 0 0 0 0 0           // vending machines (lit front)

// Wall and floor textures whose name says "light" for their colour, not for a lamp:
// taken for light fittings, they lit whole rooms far above the map's own lighting.
ptemissivenot "concrete-light"                  // nieb: light grey concrete walls
ptemissivenot "wood_brownlight"                 // medieval_soc: light brown wooden planks
