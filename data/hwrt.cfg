// hwrt.cfg: variables for the Vulkan hardware ray tracing layer.
//
// Loaded before config.cfg, so anything saved in your own config still wins.
// Read-only state set by the engine at startup:
//   hwrtavailable  1 when a Vulkan device that shares memory with OpenGL exists
//   hwrtrayquery   1 when that device also exposes VK_KHR_ray_query (RT cores)
//   hwrtngx        1 when an NVIDIA NGX runtime was found (DLAA / DLSS)
//   hwrtstalls     how many times the frame loop had to wait on the GPU
// Type /hwrtstats in the console for the same information in one line.

// Master switch. 0 is the vanilla client: baked lightmaps, no Vulkan work at all.
// Turning it on hands each frame to Vulkan and takes it back before the HUD.
hwrt 0

// What the Vulkan side composites back. Default 7 = live RT lighting.
// Saved config.cfg still wins if it wrote a different value.
//   0  nothing is drawn; the handover still runs, which is what hwrtstalls measures
//   1  the phase 1 probe on top of the frame: border, moving sweep bar, corner gradient
//   2  the probe alone, replacing the frame
//   3  a flat magenta clear, replacing the frame; no compute shader is involved,
//      so it tells apart a broken shared allocation from a broken dispatch
//   4  closest-hit barycentrics of a camera primary ray against the TLAS
//      (world + mapmodels + dynents; miss is transparent so the vanilla GL
//      frame shows). Needs hwrtrayquery 1.
//   5  RTAO overlay (same as rtaodebug 1). Needs hwrtrayquery 1.
//   6  hybrid hit shading: closest-hit samples the existing diffuse and the
//      baked lightmap (same as hwrtshade 1). Miss is transparent. A dynent
//      primary hit is also transparent so the GL model shows. Needs
//      hwrtrayquery 1. The GL world still samples the bake in this view.
//   7  point lights + one shadow ray + sun + sky (same as hwrtlight 1).
//      Albedo × (ambient + every radius-0 ET_LIGHT + glow omnis from
//      the default teleporter lamp / jumppads / screens + N nearest finite
//      ET_LIGHT + sunlight with one shadow ray + a few cosine-weighted sky
//      rays).
//      World glowmaps add on top; model masks.g mix toward albedo*mdlglow.
//      Playermodels (ENT_PLAYER) also get modelshader spec + mdlenvmap + a studio fill.
//      Miss is transparent.
//      Needs hwrtrayquery 1. Grain is 1 spp; expected. The GL world binds
//      a 1×1 unlit lightmap so the bake does not modulate underneath.
hwrtdebug 7

// Phase 3: ray-traced ambient occlusion from the GL depth buffer.
//   rtaodebug 1  grayscale AO overlay (hideous 1-spp noise is expected)
//   rtaoscale    0 = overlay only; >0 multiplies AO onto the vanilla frame
//   rtaoradius   hemisphere ray length in Sauer world units
//   rtaobias     origin offset along the geometric normal, to avoid self-hits
rtaodebug 0
rtaoradius 32
rtaoscale 0
rtaobias 0.25

// Phase 4: closest-hit samples the existing bake × diffuse.
hwrtshade 0

// Phase 5: map point lights + one shadow ray. hwrtdlights is how many nearest
// *finite-radius* lights to evaluate (1 is the milestone; 4 is the cap).
// Radius-0 lights (baker unlimited omni) are always evaluated on top of that.
hwrtlight 0
hwrtdlights 4

// Cosine-weighted hemisphere rays for skylight. Cap and default 4: one
// ray plus the filter still left dots the testers would not accept, and four
// already suited them. hwrtskyfilter still averages the leftover.
hwrtskyrays 4

// Average skyvis across the 16x16 lighting workgroup before the combine.
// 1 is the default. 0 is the raw term, so the two can be compared.
hwrtskyfilter 1

// Frames of skyvis to accumulate on top of that filter. skyvis is geometry,
// so a hit recognised as the same surface point inherits the whole running
// average that point already carries: 32 frames of the filtered 4 rays are
// worth about 1500 samples where the reprojection holds. Not looktaa -- there
// is no colour clamp here, and moving occluders are dropped by a per-pixel
// noise test rather than smeared. 0 or 1 is off.
hwrtskytemporal 32

// Temporal AA (looktaa) is a GL VARP in rendergl.cpp, default 0. Homemade
// TAA smears moving players (no velocity) and does not kill 4-ray dots.
// 0 is FXAA. Do not assign it from this file: that would run LOOK_apply
// before glsl.cfg has the shaders. The shader stays loaded for later.
// hwrtdlaajitter (temporal.cpp, default 0, not saved) is the lot-6 trial
// Halton offset. Independent of looktaa accumulation; looktaa is skipped
// while it is on so the offset is not applied twice.

// First-person body in the TLAS (SELF). 1 = only the sun projects it. The sun
// has no position, so its rays are parallel and the shadow is exactly the
// body's cross-section on any surface. A point lamp instead projects the
// body's volume, magnified by its distance ratio, which lands as the body
// squashed sideways rather than a flat silhouette -- radius 0 included, since
// unlimited reach does not make a light directional. 2 lets those omnis
// project it anyway, 3 adds the nearest-N finite lamps (also cut where the
// winning lamp changes between two pixels), 4 adds the sky, which made a 3D
// pit under your feet. 0 = off.
hwrtshadowself 1

// Visible sky while the lighting view is on. 0 (default) keeps the map
// skybox. 1 hides the cubemap and draws a disk on sunlightdir so a painted
// sun cannot disagree with the RT shadow. Lighting itself is unchanged.
hwrtsundisk 0

// Projected light from glowing ents (the thing itself still glows either way).
// Teleporters: every teleport ent (vanilla ring, custom model, or no model).
// Colour prefers a world glow pad, then a nearby magic/pad mapmodel (blue vs
// red on triforts), then the vanilla blue. Custom / modelless portals are
// shadowed and local (they do not shine through walls). 1 lights nearby
// walls, 0 is glow only. Jumppads default off.
hwrtteleportlight 1
hwrtjumppadlight 0
// Shadowed teleport / lava lamps actually evaluated (nearest around you + on
// screen). 8 keeps triforts playable; 54 at once was ~30 fps.
hwrtglowdlights 8

// GL's world pass multiplies the bake by colorparams = 2 * vslot.colorscale
// (renderva.cpp): Sauerbraten stores lightmaps at half scale and the world
// shader doubles them. Traced light is in the same units, so the lighting view
// needs the same factor; without it every RT-lit wall is half of what the
// rasteriser draws. It scales the traced light only — point lights, sun and
// sky — and never the ambient constant, so shadowed pixels keep the value they
// had and raising it widens the gap between lit and shadow instead of
// flattening the image. 2 is GL's own factor; 0 is the old half-dark world.
hwrtworldgain 2

// GPU-memory ceiling (MB) for the copied model skins at 1024×1024 before they
// drop to 512. Not a reservation: only the layers actually used are allocated.
// 192 layers (the hard cap) at 1024 need 768 MB, so 1024 never falls back.
hwrtskinbudget 1024

// Phase 6: mapmodels and dynents are extra TLAS instances. Players / bots
// get a per-pose animated BLAS (CPU-skinned, refit on the frame CB).
// Mode 7 shades those hits with the same lights as the world. hwrtmask
// still snapshots in mode 7: the composite keeps a shaded model hit and
// only drops a world hit that punched through an untraced mesh (flags).
hwrtmask 1

// How many TLAS instances the scenery may fill (cap 4096). Only mapmodels
// answer to it, and always the nearest ones, so lowering it never removes a
// player and what it does remove is on the horizon. A model the rays cannot
// see is not merely unlit: they carry on through it and light whatever stands
// behind, so a missing tree shows the tree behind it. cmvalley posts 2614
// mapmodels and needs all of them.
// Barely a speed dial. Dispatch on cmvalley at 1440p in its forest: 5.90 ms
// for the nearest 256, 6.94 for 1024, 7.46 for all 2614 -- 48 images per
// second either way, against 62 with hwrt 0. The cost is the alpha-tested
// canopy right in front of the camera, which sorting by distance always keeps.
hwrtmaxinsts 4096

// Alpha-tested model meshes (tree foliage, CTF flags) are in the TLAS as
// a non-opaque BLAS geometry with a skins.a test, so they cast shadows and
// keep their holes. hwrtdepthmask still drops a world hit that punched
// through something the TLAS does not have (grass, water, world alpha).
hwrtdepthmask 1

// Modes 6 and 7 composite over a frame that already has models rasterised.
// tex0 alpha: 0 = miss, 0.5 = shaded model, 1 = world. tex1 is the window
// depth before rendermapmodels() / rendergame(), tex2 the same buffer after
// them. A world hit behind a GL model is the hudgun-class hole (grass,
// world alpha that never entered the TLAS); a shaded model hit is kept.
shader 0 "hwrtcompositemask" [
    attribute vec4 vvertex, vcolor;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    varying vec4 color;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
        color = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 color;
    uniform sampler2D tex0, tex1, tex2;
    void main(void)
    {
        vec4 c = texture2D(tex0, texcoord0);
        if(c.a < 0.25) discard;
        if(c.a > 0.75 && texture2D(tex2, texcoord0).r < texture2D(tex1, texcoord0).r) discard;
        gl_FragColor = vec4(c.rgb * color.rgb, 1.0);
    }
]

// Temporal AA for the composited GL frame. Loaded here so git has the
// shader; data/glsl.cfg defines the same name next to lookssao if the
// look system is present (last write wins). No ] in the fragment body.
shader 0 "looktaa" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0, tex1, tex2;
    uniform mat4 invcamproj;
    uniform mat4 prevcamproj;
    uniform vec4 looktaaproj;
    uniform vec4 looktaaparams;
    void main(void)
    {
        vec4 color = texture2D(tex0, texcoord0);
        vec3 cur = color.rgb;
        if(looktaaparams.x < 0.5)
        {
            gl_FragColor = color;
            return;
        }
        vec2 px = vec2(looktaaproj.z, looktaaproj.w);
        float z = texture2D(tex1, texcoord0).r;
        z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x, -px.y)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2( 0.0,  -px.y)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,  -px.y)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x,   0.0)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,   0.0)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2(-px.x,   px.y)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2( 0.0,    px.y)).r);
        z = min(z, texture2D(tex1, texcoord0 + vec2( px.x,   px.y)).r);
        if(z > 0.9995)
        {
            gl_FragColor = color;
            return;
        }
        float ndc0 = z * 2.0 - 1.0;
        vec4 clip = vec4(texcoord0.x * 2.0 - 1.0, texcoord0.y * 2.0 - 1.0, ndc0, 1.0);
        vec4 worldh = invcamproj * clip;
        vec3 world = worldh.xyz / max(worldh.w, 0.000001);
        vec4 prevh = prevcamproj * vec4(world, 1.0);
        float pw = max(prevh.w, 0.000001);
        vec2 prevuv = prevh.xy / pw;
        prevuv = prevuv * 0.5 + 0.5;
        if(prevh.w <= 0.0 || prevuv.x < 0.0 || prevuv.x > 1.0 || prevuv.y < 0.0 || prevuv.y > 1.0)
        {
            gl_FragColor = color;
            return;
        }
        vec3 cmin = cur;
        vec3 cmax = cur;
        vec3 s;
        s = texture2D(tex0, texcoord0 + vec2(-px.x, -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2( 0.0,  -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2( px.x,  -px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2(-px.x,   0.0)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2( px.x,   0.0)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2(-px.x,   px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2( 0.0,    px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        s = texture2D(tex0, texcoord0 + vec2( px.x,   px.y)).rgb; cmin = min(cmin, s); cmax = max(cmax, s);
        vec3 hist = clamp(texture2D(tex2, prevuv).rgb, cmin, cmax);
        float vel = length((prevuv - texcoord0) / max(px, vec2(0.000001)));
        float contrast = length(cmax - cmin);
        float edge = clamp(contrast * 3.0, 0.0, 1.0);
        float curw = mix(0.28, 0.10, edge);
        float farf = clamp((z - 0.92) / 0.07, 0.0, 1.0);
        curw = mix(curw, max(curw, 0.40), farf * (1.0 - edge));
        curw = mix(curw, min(curw + 0.12, 0.45), clamp(vel * 0.08, 0.0, 1.0));
        if(vel > 48.0) curw = 1.0;
        gl_FragColor = vec4(mix(hist, cur, curw), color.a);
    }
]

// Dedicated velocity image (lots 2-6). RGBA16F:
//   RG = previous_unjittered - current_unjittered, pixels, +Y up (GL)
//   B  = 1 covered (world / rigid / mrfixit / attachments / FPS gun)
//   A  = 1 character / attachment / gun
// B/A are internal marks, not Streamline transparency / bias masks.
// Reconstruct scenery from the depth that was rasterised (jittered camproj
// when hwrtdlaajitter is on), then project with the unjittered pair so a
// still camera stays near zero while the picture still shifts. Rigid /
// skinned / HUD passes rasterise with the jittered MVP and compute motion
// from unjittered clip. veljitter is pixel units, curr.xy then prev.xy.
// hwrtveldebug 2/3 add (prev_jitter - curr_jitter) when warping two jittered
// colour frames. The HUD-less colour/depth pair lives in hwrttemporalcurrent().
shader 0 "hwrtvelocity" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform mat4 invcamproj;
    uniform mat4 currunjitproj;
    uniform mat4 prevunjitproj;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        float z = texture2D(tex0, texcoord0).r;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5)
        {
            float ndc0 = z * 2.0 - 1.0;
            vec4 clip = vec4(texcoord0.x * 2.0 - 1.0, texcoord0.y * 2.0 - 1.0, ndc0, 1.0);
            vec4 worldh = invcamproj * clip;
            vec3 world = worldh.xyz / max(worldh.w, 0.000001);
            vec4 prevh = prevunjitproj * vec4(world, 1.0);
            vec2 curruv = texcoord0;
            if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001)
            {
                vec4 currh = currunjitproj * vec4(world, 1.0);
                if(currh.w > 0.0) curruv = (currh.xy / currh.w) * 0.5 + 0.5;
            }
            if(prevh.w > 0.0)
            {
                vec2 prevuv = (prevh.xy / prevh.w) * 0.5 + 0.5;
                motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
            }
        }
        gl_FragColor = vec4(motion, 1.0, 0.0);
    }
]

shader 0 "hwrtveldebug" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0, tex1, tex2;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 vel = texture2D(tex0, texcoord0);
        vec3 cur = texture2D(tex1, texcoord0).rgb;
        float valid = vel.z;
        vec2 motion = vel.xy;
        vec2 px = vec2(velparams.x, velparams.y);
        vec2 jdelta = vec2(veljitter.z - veljitter.x, veljitter.w - veljitter.y);
        vec2 prevuv = texcoord0 + motion * px + jdelta * px;
        float mode = velparams.z;
        vec3 outc = cur;
        if(valid < 0.5)
        {
            outc = vec3(0.72, 0.0, 0.68);
        }
        else if(mode < 1.5)
        {
            float s = velparams.w;
            outc = vec3(motion.x * s + 0.5, motion.y * s + 0.5, 0.12);
        }
        else if(prevuv.x < 0.0 || prevuv.x > 1.0 || prevuv.y < 0.0 || prevuv.y > 1.0)
        {
            outc = vec3(0.05, 0.18, 0.28);
        }
        else
        {
            vec3 hist = texture2D(tex2, prevuv).rgb;
            if(mode < 2.5) outc = hist;
            else
            {
                vec3 d = abs(cur - hist);
                float e = (d.x + d.y + d.z) * 4.0;
                outc = vec3(e, 1.0 - clamp(e, 0.0, 1.0), 0.0);
            }
        }
        gl_FragColor = vec4(outc, 1.0);
    }
]

// Rigid mapmodel motion: same RG/B convention as hwrtvelocity.
// Vertex uses this frame's JITTERED modelmatrix (camproj_used * object) so
// raster matches the colour image, and unjittered clip pair for motion.
// Alphatest uses the skin so holes keep the wall.
shader 0 "hwrtvelobject" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform mat4 prevmodelmatrix;
    uniform mat4 currunjitmatrix;
    uniform vec2 texscroll;
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        prevclip = prevmodelmatrix * vvertex;
        currclip = currunjitmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        vec2 curruv = gl_FragCoord.xy * vec2(velparams.x, velparams.y);
        if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001 && currclip.w > 0.0)
            curruv = (currclip.xy / currclip.w) * 0.5 + 0.5;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5 && prevclip.w > 0.0)
        {
            vec2 prevuv = (prevclip.xy / prevclip.w) * 0.5 + 0.5;
            motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
        }
        gl_FragColor = vec4(motion, 1.0, 0.0);
    }
]

// Skinned character motion (lot 3/4/5/6). Same RG/B/A convention. vvertex is this
// frame's model-space position after the bones actually used for the colour
// draw; vnormal.xyz is the same vertex skinned with the stored previous pose
// (not a replay of the animation clock). Raster is jittered; motion uses the
// unjittered clip pair. A = 1 so proofs can pick character pixels apart from scenery.
shader 0 "hwrtvelskel" [
    attribute vec4 vvertex;
    attribute vec3 vnormal;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform mat4 prevmodelmatrix;
    uniform mat4 currunjitmatrix;
    uniform vec2 texscroll;
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        prevclip = prevmodelmatrix * vec4(vnormal, 1.0);
        currclip = currunjitmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec4 prevclip;
    varying vec4 currclip;
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    uniform vec4 veljitter;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        vec2 curruv = gl_FragCoord.xy * vec2(velparams.x, velparams.y);
        if(abs(veljitter.x) + abs(veljitter.y) + abs(veljitter.z) + abs(veljitter.w) > 0.000001 && currclip.w > 0.0)
            curruv = (currclip.xy / currclip.w) * 0.5 + 0.5;
        vec2 motion = vec2(0.0, 0.0);
        if(velparams.z > 0.5 && prevclip.w > 0.0)
        {
            vec2 prevuv = (prevclip.xy / prevclip.w) * 0.5 + 0.5;
            motion = (prevuv - curruv) / vec2(velparams.x, velparams.y);
        }
        gl_FragColor = vec4(motion, 1.0, 1.0);
    }
]

shader 0 "hwrtvelunlit" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    uniform mat4 modelmatrix;
    uniform vec2 texscroll;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        gl_FragColor = vec4(skin.rgb, 1.0);
    }
]

// Proof-only identity of the skinned triangle that won this pixel.
// RGB = instance slot, mesh, triangle (1-based). A = window depth.
// Independent of velocity A. Alphatest matches the colour / vector passes.
shader 0 "hwrtvelid" [
    attribute vec4 vvertex;
    attribute vec2 vtexcoord0;
    attribute vec4 vcolor;
    uniform mat4 modelmatrix;
    uniform vec2 texscroll;
    varying vec2 texcoord0;
    varying vec4 id;
    void main(void)
    {
        gl_Position = modelmatrix * vvertex;
        texcoord0 = vtexcoord0 + texscroll;
        id = vcolor;
    }
] [
    varying vec2 texcoord0;
    varying vec4 id;
    uniform sampler2D tex0;
    uniform vec4 velparams;
    void main(void)
    {
        vec4 skin = texture2D(tex0, texcoord0);
        if(velparams.w > 0.0 && skin.a <= velparams.w) discard;
        gl_FragColor = vec4(id.rgb, gl_FragCoord.z);
    }
]

// Lot 7: pack HUD-less colour/depth/velocity into shared images with a Y flip
// (GL bottom-left -> memory row 0 = top of screen), then blit DLAA output back.
shader 0 "hwrtdlaapack" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0, tex1, tex2;
    uniform vec4 dlaapass;
    uniform vec4 dlaaparam;
    uniform mat4 dlaainvused;
    uniform mat4 dlaacurrunjit;
    uniform mat4 dlaaprevunjit;
    void main(void)
    {
        vec2 srcuv = vec2(texcoord0.x, 1.0 - texcoord0.y);
        if(dlaapass.x < 0.5)
        {
            vec4 c = texture2D(tex0, srcuv);
            gl_FragColor = vec4(c.rgb, 1.0);
            return;
        }
        if(dlaapass.x < 1.5)
        {
            float z = texture2D(tex1, srcuv).r;
            gl_FragColor = vec4(z, 0.0, 0.0, 1.0);
            return;
        }
        if(dlaapass.x < 2.5)
        {
            vec2 mv = vec2(0.0, 0.0);
            if(dlaaparam.w > 0.5)
            {
                vec4 vel = texture2D(tex2, srcuv);
                if(vel.b >= 0.5)
                {
                    mv = vec2(vel.r, -vel.g);
                }
                else if(dlaaparam.z > 0.5)
                {
                    float z = texture2D(tex1, srcuv).r;
                    vec4 clip = vec4(srcuv.x * 2.0 - 1.0, srcuv.y * 2.0 - 1.0, z * 2.0 - 1.0, 1.0);
                    vec4 worldh = dlaainvused * clip;
                    float ww = worldh.w;
                    if(ww < 0.0) ww = -ww;
                    if(ww < 0.000001) ww = 0.000001;
                    vec3 world = worldh.xyz / ww;
                    vec4 currh = dlaacurrunjit * vec4(world, 1.0);
                    vec4 prevh = dlaaprevunjit * vec4(world, 1.0);
                    float cw = currh.w;
                    float pw = prevh.w;
                    if(cw > 0.000001 && pw > 0.000001)
                    {
                        vec2 res = dlaaparam.xy;
                        vec2 currpx = (currh.xy / cw * 0.5 + 0.5) * res;
                        vec2 prevpx = (prevh.xy / pw * 0.5 + 0.5) * res;
                        vec2 mvgl = prevpx - currpx;
                        mv = vec2(mvgl.x, -mvgl.y);
                    }
                }
            }
            gl_FragColor = vec4(mv, 0.0, 1.0);
            return;
        }
        float b = texture2D(tex0, srcuv).r;
        gl_FragColor = vec4(b, b, b, 1.0);
    }
]

shader 0 "hwrtdlaablit" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    void main(void)
    {
        vec2 uv = vec2(texcoord0.x, 1.0 - texcoord0.y);
        gl_FragColor = texture2D(tex0, uv);
    }
]

shader 0 "hwrtdlaabiasfade" [
    attribute vec4 vvertex;
    uniform vec4 screentexcoord0;
    varying vec2 texcoord0;
    void main(void)
    {
        gl_Position = vvertex;
        texcoord0 = vvertex.xy * screentexcoord0.xy + screentexcoord0.zw;
    }
] [
    varying vec2 texcoord0;
    uniform sampler2D tex0;
    uniform vec4 biasfade;
    void main(void)
    {
        // Screen-space persist of the previous mask. The CPU pass skips this
        // shader when the camera moved, so a rotation cannot leave a fixed
        // footprint on the scenery. Fade 0.5/frame with a 0.04 floor.
        float b = texture2D(tex0, texcoord0).r * biasfade.x;
        if(b < 0.04) b = 0.0;
        gl_FragColor = vec4(b, b, b, 1.0);
    }
]

dlaa 0         // unused stub in hwrt.cpp; Graphics Anti-Aliasing uses hwrtngxmode
dlss 0         // unused stub; Graphics Anti-Aliasing uses hwrtngxmode
dlssquality 1  // unused stub; kept so old configs load without errors

// Overlay per-stage GPU times for the interop sandwich (mask, depth, BLAS,
// TLAS, dispatch, composite) plus CPU skin/gather. 0 is off; hwrtstats always
// prints the last completed samples.
hwrttimes 0

// Convenience: only turn ray tracing on when the machine can actually do it.
hwrttoggle = [
    if $hwrtavailable [
        hwrt (! $hwrt)
    ] [
        echo "hardware ray tracing is not available on this system"
    ]
]

// F6 (bound from autoexec if the key is free): freeze / unfreeze the first-person
// body used as a shadow occluder. Diagnostic only, default off.
